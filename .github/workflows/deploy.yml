name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pages under docs/ are generated from data/*.yml. Regenerate and fail if
      # anything changed: that means either a generated file was hand-edited
      # (the edit would be silently lost on the next build) or the data files
      # were changed without re-running the generator.
      - name: Check generated content is up to date
        run: |
          python tools/build_content.py
          if ! git diff --quiet; then
            echo "::error::Generated content is stale or a generated file was edited by hand."
            echo "Run 'python tools/build_content.py' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Build site
        run: mkdocs build --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
