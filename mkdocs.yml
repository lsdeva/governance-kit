site_name: GovKit
site_description: >-
  A free, open collection of board-ready data and AI governance templates —
  frameworks, policies, operating model, registers, and EU AI Act readiness.
site_url: https://govkit.soa.team/
repo_url: https://github.com/lsdeva/governance-kit
repo_name: lsdeva/governance-kit
edit_uri: edit/main/docs/
copyright: >-
  Content licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> —
  free to use, adapt, and share with attribution.

theme:
  name: material
  language: en
  # Privacy: `font: false` stops Material fetching Roboto from Google Fonts on
  # every page view, which would send visitor IPs to Google. The site uses the
  # reader's system font stack instead. Do not re-enable without a reason.
  font: false
  # overrides/partials/source.html removes the api.github.com stats call.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # `custom` makes Material read --md-primary-fg-color* from our own CSS,
      # so the brand tokens in stylesheets/extra.css drive the whole theme.
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css
  - stylesheets/docs.css
  - assess/assess.css
  - assess/registers.css
  - assess/decide.css
  - assets/plans.css

extra_javascript:
  - assess/assess.js
  - assess/checklist.js
  # xlsx.js must load before registers.js — it provides window.GKXlsx.
  - assess/xlsx.js
  - assess/registers.js
  - assess/decide.js
  - assets/tasks.js
  - assets/workspace.js
  - assets/plans.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  # Pulls generated counts (snippets/stats.md) into hand-written pages so
  # claims like "25 of 26 fully drafted" cannot drift from the data.
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lsdeva/governance-kit
  generator: false
  # LANDING:START (generated - do not edit by hand)
  landing:
    announcement:
      show: true
      text: Art. 50 transparency obligations are in force since 2 Aug 2026
      link_text: check whether your systems must disclose
      link_url: decide/
    reviewed: '2026-08-03'
    tiles:
    - value: '26'
      label: Board-ready templates
      note: 25 fully drafted
      tone: good
    - value: '40'
      label: Assessment questions · 8 roles
      note: Evidence guidance on every one
    - value: '2'
      label: Guided decisions to a verdict
      note: Risk tier · Provider or deployer
    - value: '0'
      label: Accounts, uploads, trackers
      note: Everything stays in your browser
  # LANDING:END

