# Spreadsheet definitions for templates that are genuinely worked IN Excel
# rather than read on a page — the registers, logs, and scoring tools.
#
# tools/build_downloads.py turns each of these into an .xlsx with a frozen
# header row, sized columns, dropdown validation on the `choices` columns, and
# one or two illustrative rows the user overwrites.
#
# Keyed by template id from data/templates.yml. A template with no entry here
# still gets a .docx; only these get a .xlsx as well.
#
# Column fields:
#   name    - header text
#   width   - column width in Excel units
#   help    - cell comment shown on hover; explains what belongs in the column
#   choices - if present, becomes a dropdown (data validation)

data-asset-register:
  sheet: Data Asset Register
  intro: >-
    One row per data asset. Start with personal, regulated, and AI-feeding data;
    a short accurate register beats an exhaustive stale one.
  columns:
    - {name: "Asset ID", width: 10, help: "Stable reference, e.g. DA-001. Other registers link to this."}
    - {name: "Asset name", width: 26, help: "Business language, not a table name."}
    - {name: "Description", width: 34, help: "What it actually is, to someone outside the team."}
    - {name: "Domain", width: 16, help: "The data domain it belongs to."}
    - {name: "Data Owner", width: 18, help: "Named accountable person, not a team."}
    - {name: "Steward", width: 18, help: "Day-to-day contact for meaning and quality."}
    - {name: "Classification", width: 15, choices: [Public, Internal, Confidential, Restricted], help: "Drives handling rules."}
    - {name: "Personal data?", width: 14, choices: [Yes, "No", Mixed], help: "Triggers lawful basis and DPIA questions."}
    - {name: "Special category?", width: 16, choices: [Yes, "No"], help: "Health, biometrics, beliefs, etc. Default to Restricted."}
    - {name: "System of record", width: 20, help: "Where the authoritative copy lives."}
    - {name: "Source", width: 20, help: "Where it came from; licence if external."}
    - {name: "Lawful basis", width: 20, help: "Required where personal data is involved."}
    - {name: "Used in AI?", width: 16, help: "System IDs from the AI inventory. This column earns its keep during an incident."}
    - {name: "Retention", width: 14, help: "How long, and under what rule."}
    - {name: "Last reviewed", width: 14, help: "Date."}
    - {name: "Next review", width: 14, help: "Date. Makes staleness visible."}
  rows:
    - [DA-001, Customer master, "Golden record for customer identity and contact", Customer, "[name]", "[name]", Confidential, Yes, "No", "[CRM]", Direct collection, Contract, AI-003, 7 years, "", ""]
    - [DA-002, Employee records, "HR records for current and former staff", Employee, "[name]", "[name]", Confidential, Yes, Yes, "[HRIS]", Direct collection, Legal obligation, AI-004, 6 years post-exit, "", ""]

ai-system-inventory:
  sheet: AI System Inventory
  intro: >-
    One row per AI system — built, bought, or embedded in software you already
    licence. Expect the real count to be two to three times the first estimate.
  columns:
    - {name: "System ID", width: 10, help: "Stable reference, e.g. AI-001."}
    - {name: "System name", width: 24, help: "What people call it."}
    - {name: "Purpose", width: 34, help: "What it does and what decisions it drives."}
    - {name: "Business owner", width: 20, help: "The named AI Accountable Owner. Not a team."}
    - {name: "Technical owner", width: 18, help: "Who operates it day to day."}
    - {name: "Source", width: 14, choices: [Build, Buy, Embedded, Fine-tuned], help: "Determines which policy applies."}
    - {name: "Vendor / product", width: 20, help: "For bought or embedded systems."}
    - {name: "Our role", width: 14, choices: [Provider, Deployer, Importer, Distributor], help: "Fine-tuning or rebranding can make you the provider."}
    - {name: "Risk tier", width: 14, choices: [Prohibited, High-risk, Limited, Minimal, Unclassified], help: "Classify before deployment."}
    - {name: "Tier rationale", width: 32, help: "WHY. A label without reasoning cannot be defended or reviewed."}
    - {name: "Annex ref", width: 14, help: "If high-risk, which Annex III point."}
    - {name: "Model / technique", width: 20, help: "e.g. GPT-class LLM, gradient boosting."}
    - {name: "Data sources", width: 20, help: "Asset IDs from the data asset register."}
    - {name: "Personal data?", width: 14, choices: [Yes, "No"], help: "Triggers DPIA."}
    - {name: "Affects individuals?", width: 16, choices: [Yes, "No"], help: "Triggers oversight and transparency duties."}
    - {name: "Lifecycle stage", width: 15, choices: [Ideation, Development, Live, Retired], help: "Register at ideation, not at launch."}
    - {name: "Human oversight", width: 24, help: "How, and by whom."}
    - {name: "Documentation", width: 18, help: "Link to the model card."}
    - {name: "Risk assessment", width: 18, help: "Link to the AI risk assessment."}
    - {name: "Last reviewed", width: 14, help: "Date."}
    - {name: "Next review", width: 14, help: "Date."}
  rows:
    - [AI-001, Demand forecasting, "Forecasts weekly demand by SKU", "[name]", "[name]", Build, "", Provider, Minimal, "No effect on individuals; internal planning only", "", Gradient boosting, DA-003, "No", "No", Live, "Planner reviews before ordering", "", "", "", ""]
    - [AI-004, CV screening, "Ranks applicants for shortlisting", "[name]", "[name]", Buy, "[vendor]", Deployer, High-risk, "Annex III(4) — employment; screens candidates", "Annex III(4)", Vendor proprietary, DA-002, Yes, Yes, Live, "Recruiter reviews every rejection", "", "", "", ""]

risk-register:
  sheet: Risk Register
  intro: >-
    Write risks as cause, event, and consequence. Rating and residual columns
    calculate automatically from likelihood and impact.
  columns:
    - {name: "Risk ID", width: 10, help: "Stable reference, e.g. R-001."}
    - {name: "Risk description", width: 52, help: "Because [cause], [event] may happen, leading to [consequence]."}
    - {name: "Category", width: 16, choices: [Compliance, Fairness, Security, Operational, Reputational, Financial, Privacy], help: "Risk type."}
    - {name: "Likelihood", width: 12, choices: ["1", "2", "3", "4", "5"], help: "1 Rare … 5 Almost certain."}
    - {name: "Impact", width: 10, choices: ["1", "2", "3", "4", "5"], help: "1 Negligible … 5 Severe."}
    - {name: "Rating", width: 10, formula: "=IF(AND(ISNUMBER({Likelihood}),ISNUMBER({Impact})),{Likelihood}*{Impact},\"\")", help: "Likelihood x Impact. Calculated."}
    - {name: "Level", width: 12, formula: "=IF({Rating}=\"\",\"\",IF({Rating}>=15,\"Critical\",IF({Rating}>=10,\"High\",IF({Rating}>=5,\"Medium\",\"Low\"))))", help: "Calculated from the rating."}
    - {name: "Owner", width: 18, help: "Named person accountable for treating it."}
    - {name: "Treatment", width: 14, choices: [Treat, Tolerate, Transfer, Terminate], help: "Tolerate requires a named acceptor."}
    - {name: "Controls / actions", width: 40, help: "What is actually being done."}
    - {name: "Target rating", width: 12, help: "Where you expect to get to."}
    - {name: "Residual rating", width: 14, help: "Where you actually are after treatment."}
    - {name: "Accepted by", width: 18, help: "Required if tolerating. Risk tolerated by nobody has been ignored."}
    - {name: "Date accepted", width: 14, help: "Date."}
    - {name: "Next review", width: 14, help: "Critical monthly, High quarterly, Medium half-yearly, Low annually."}
  rows:
    - [R-001, "Because AI systems are procured without governance review, unassessed high-risk systems may go live, leading to regulatory breach and enforcement", Compliance, "4", "4", "", "", "[name]", Treat, "Mandatory intake gate; quarterly SaaS sweep", "8", "", "", "", ""]
    - [R-002, "Because training data under-represents some groups, the model may produce discriminatory outcomes, leading to harm and legal claims", Fairness, "3", "5", "", "", "[name]", Treat, "Representativeness testing at G4; subgroup metrics", "6", "", "", "", ""]

incident-log:
  sheet: Issue & Incident Log
  intro: >-
    Log every AI issue and incident. The gap between "occurred" and "detected"
    is itself a finding worth tracking.
  columns:
    - {name: "Incident ID", width: 12, help: "e.g. INC-001."}
    - {name: "Date occurred", width: 14, help: "When it actually happened."}
    - {name: "Date detected", width: 14, help: "When you found out. The gap matters."}
    - {name: "Date reported", width: 14, help: "When it was raised internally."}
    - {name: "Title", width: 30, help: "One line, factual."}
    - {name: "System", width: 14, help: "System ID from the AI inventory."}
    - {name: "Severity", width: 12, choices: [S1 Critical, S2 Major, S3 Moderate, S4 Minor], help: "S1 triggers immediate committee and regulator assessment."}
    - {name: "Type", width: 18, choices: [Fairness/bias, Accuracy/drift, Data leak, Unauthorised use, Security, Availability, Transparency, Oversight failure, Third-party, Regulatory], help: "Incident category."}
    - {name: "Description", width: 44, help: "What happened. Factual, no blame."}
    - {name: "Reported by", width: 16, help: "Who raised it."}
    - {name: "Owner", width: 16, help: "Who is handling it."}
    - {name: "People affected", width: 15, help: "How many, and who."}
    - {name: "Personal data?", width: 14, choices: [Yes, "No", Unknown], help: "May trigger breach notification."}
    - {name: "Reportable?", width: 16, choices: [Yes, "No", Under assessment], help: "Art. 73 clock starts when you establish the link, not when you finish investigating."}
    - {name: "Immediate action", width: 32, help: "Including whether the system was suspended."}
    - {name: "Root cause", width: 32, help: "The real one, not the proximate one."}
    - {name: "Remediation", width: 32, help: "Actions, owners, dates."}
    - {name: "Lessons / changes", width: 32, help: "What changed so it cannot recur."}
    - {name: "Status", width: 12, choices: [Open, In progress, Closed], help: "Current state."}
    - {name: "Date closed", width: 14, help: "Date."}
  rows:
    - [INC-001, "", "", "", "Model returned biased ranking", AI-004, S2 Major, Fairness/bias, "[what happened]", "[name]", "[name]", "", Yes, Under assessment, "[action taken]", "", "", "", Open, ""]

processing-dpia-log:
  sheet: Processing Activities
  intro: >-
    Extend your existing Art. 30 record rather than starting a second list.
    The DPIA tab tracks assessments against these activities.
  columns:
    - {name: "Ref", width: 10, help: "e.g. P-001."}
    - {name: "Activity", width: 26, help: "The processing activity."}
    - {name: "Purpose", width: 32, help: "Why you process it."}
    - {name: "Lawful basis", width: 20, choices: [Consent, Contract, Legal obligation, Vital interests, Public task, Legitimate interests], help: "Must be identified BEFORE processing begins."}
    - {name: "Categories of data", width: 28, help: "What data, in categories."}
    - {name: "Data subjects", width: 20, help: "Whose data."}
    - {name: "Special category?", width: 16, choices: [Yes, "No"], help: "Triggers additional conditions."}
    - {name: "Recipients", width: 22, help: "Who else sees it, including processors."}
    - {name: "Transfers", width: 18, help: "Outside the UK/EEA, and the safeguard used."}
    - {name: "Retention", width: 16, help: "How long."}
    - {name: "AI system", width: 14, help: "System ID, if AI is involved."}
    - {name: "DPIA ref", width: 12, help: "Link to the DPIA row."}
  rows:
    - [P-001, Customer support triage, "Route and summarise inbound tickets", Legitimate interests, "Contact details, ticket content", Customers, "No", "[vendor]", "[country]", 3 years, AI-002, DPIA-002]
  extra_sheets:
    - name: DPIA Log
      columns:
        - {name: "DPIA ref", width: 12, help: "e.g. DPIA-001."}
        - {name: "System", width: 14, help: "AI system ID."}
        - {name: "Processing", width: 28, help: "What is being assessed."}
        - {name: "Started", width: 12, help: "Date."}
        - {name: "Completed", width: 12, help: "Date."}
        - {name: "Outcome", width: 22, choices: [Proceed, Proceed with controls, Do not proceed, Under review], help: "The decision."}
        - {name: "Residual risk", width: 14, choices: [Low, Medium, High], help: "After mitigation. High may require prior consultation."}
        - {name: "DPO opinion", width: 26, help: "Must be recorded. Proceeding against it must be justified."}
        - {name: "Authority consulted?", width: 18, choices: [Yes, "No", Not required], help: "Required where high risk remains after mitigation."}
        - {name: "Next review", width: 14, help: "Date."}
      rows:
        - [DPIA-001, AI-004, Candidate screening, "", "", Proceed with controls, Medium, "", "No", ""]

control-library:
  sheet: Control Library
  intro: >-
    Map obligations to controls. The Assurance Map tab exposes obligations
    nobody is assuring — look for the blank cells.
  columns:
    - {name: "Control ID", width: 11, help: "e.g. C-01."}
    - {name: "Obligation", width: 26, help: "The requirement — regulatory, contractual, or internal."}
    - {name: "Control description", width: 46, help: "What you actually do to satisfy it."}
    - {name: "Type", width: 13, choices: [Preventive, Detective, Corrective], help: "Control type."}
    - {name: "Frequency", width: 15, choices: [Continuous, Per system, Per release, Per event, Monthly, Quarterly, Annual], help: "How often it operates."}
    - {name: "Owner", width: 18, help: "Named, first line."}
    - {name: "Evidence", width: 32, help: "What you would show to prove it operated."}
    - {name: "Assurance by", width: 16, choices: [1L self-assessment, 2L review, 3L audit, External], help: "Who checks."}
    - {name: "Assurance frequency", width: 18, help: "How often it is checked."}
    - {name: "Last tested", width: 13, help: "Date."}
    - {name: "Test result", width: 16, choices: [Effective, Partially effective, Not effective, Not tested], help: "Design and operating effectiveness."}
    - {name: "Next test", width: 13, help: "Date."}
  rows:
    - [C-01, "Art. 5 — prohibited practices", "Intake screen at G1 blocks prohibited use cases", Preventive, Per system, "[Gov Lead]", "Screening record in inventory", 2L review, Quarterly, "", Not tested, ""]
    - [C-02, "Art. 6 — classification", "Every system classified with recorded rationale before build", Preventive, Per system, "[Gov Lead]", "AI system inventory", 2L review, Quarterly, "", Not tested, ""]
    - [C-06, "Art. 12 — logging", "Automatic logging enabled and retained", Detective, Continuous, "[Tech Owner]", "Log configuration; retention proof", 2L review, Quarterly, "", Not tested, ""]
  extra_sheets:
    - name: Assurance Map
      columns:
        - {name: "Obligation area", width: 28, help: "Grouped obligation."}
        - {name: "1L — does it", width: 22, help: "Who performs the control."}
        - {name: "2L — challenges", width: 22, help: "Who reviews and challenges."}
        - {name: "3L — assures", width: 22, help: "Who provides independent assurance."}
        - {name: "Gap?", width: 26, help: "A blank column is an obligation you are trusting without checking."}
      rows:
        - ["Prohibited practices", "Product / ML", Governance, Audit, ""]
        - ["Classification", "[Gov Lead]", Legal, Audit, ""]
        - ["Risk management", "AI Owners", Risk, Audit, ""]
        - ["Data governance", "Data Owners", Governance, Audit, ""]
        - [Documentation, "ML teams", Governance, Audit, ""]
        - ["Human oversight", Product, Governance, Audit, ""]
        - [Transparency, Product, Legal, Audit, ""]
        - ["Third party", Procurement, "Security / Legal", Audit, ""]
        - [Literacy, HR, Governance, Audit, ""]

maturity-assessment:
  sheet: Maturity Assessment
  intro: >-
    Score each dimension 0-4 against the descriptors on the Levels tab. Score
    what is true, not what is intended. The average calculates automatically.
  columns:
    - {name: "#", width: 5, help: "Dimension number."}
    - {name: "Dimension", width: 34, help: "The capability being assessed."}
    - {name: "Score (0-4)", width: 12, choices: ["0", "1", "2", "3", "4"], help: "0 Absent, 1 Initial, 2 Developing, 3 Defined, 4 Managed."}
    - {name: "Evidence", width: 44, help: "What proves this score. A score without evidence is an opinion."}
    - {name: "Target", width: 10, choices: ["0", "1", "2", "3", "4"], help: "Where you want to be."}
    - {name: "Gap", width: 8, formula: "=IF(AND(ISNUMBER({Score (0-4)}),ISNUMBER({Target})),{Target}-{Score (0-4)},\"\")", help: "Target minus score. Calculated."}
    - {name: "Owner", width: 18, help: "Who moves it."}
    - {name: "Notes", width: 32, help: "Context."}
  rows:
    - ["1", "Governance mandate & sponsorship", "", "", "", "", "", ""]
    - ["2", "Committee & decision rights", "", "", "", "", "", ""]
    - ["3", "Roles & accountability (RACI)", "", "", "", "", "", ""]
    - ["4", "Policy & standards coverage", "", "", "", "", "", ""]
    - ["5", "Data ownership & domains", "", "", "", "", "", ""]
    - ["6", "Data quality management", "", "", "", "", "", ""]
    - ["7", "Data classification & handling", "", "", "", "", "", ""]
    - ["8", "AI inventory & classification", "", "", "", "", "", ""]
    - ["9", "AI risk assessment process", "", "", "", "", "", ""]
    - ["10", "Model documentation", "", "", "", "", "", ""]
    - ["11", "Human oversight design", "", "", "", "", "", ""]
    - ["12", "Third-party / vendor AI risk", "", "", "", "", "", ""]
    - ["13", "Incident management", "", "", "", "", "", ""]
    - ["14", "Control library & assurance", "", "", "", "", "", ""]
    - ["15", "Board reporting", "", "", "", "", "", ""]
    - ["16", "AI literacy & training", "", "", "", "", "", ""]
    - ["17", "Regulatory readiness (EU AI Act)", "", "", "", "", "", ""]
  extra_sheets:
    - name: Levels
      columns:
        - {name: "Level", width: 8}
        - {name: "Name", width: 16}
        - {name: "Description", width: 62}
      rows:
        - ["0", Absent, "Nothing in place."]
        - ["1", Initial, "Ad hoc, individual effort, undocumented."]
        - ["2", Developing, "Documented but inconsistently applied."]
        - ["3", Defined, "Standardised, applied consistently, evidenced."]
        - ["4", Managed, "Measured, reviewed, and improved on evidence."]

kpi-dashboard:
  sheet: KPI Dashboard
  intro: >-
    Hold the metric set stable — trend is the point. Variance calculates
    automatically against target.
  columns:
    - {name: "Metric", width: 34, help: "What is measured."}
    - {name: "Type", width: 10, choices: [KPI, KRI], help: "KPI = is it working. KRI = is something about to go wrong."}
    - {name: "Definition", width: 40, help: "Exactly how it is calculated."}
    - {name: "Current", width: 11, help: "This period."}
    - {name: "Previous", width: 11, help: "Last period."}
    - {name: "Target", width: 11, help: "Where it should be."}
    - {name: "Variance", width: 11, formula: "=IF(AND(ISNUMBER({Current}),ISNUMBER({Target})),{Current}-{Target},\"\")", help: "Current minus target. Calculated."}
    - {name: "Trend", width: 10, choices: ["Improving", "Flat", "Worsening"], help: "Direction matters more than level."}
    - {name: "RAG", width: 8, choices: [Green, Amber, Red], help: "Define thresholds once and keep them fixed."}
    - {name: "Owner", width: 16, help: "Who acts on it."}
    - {name: "Commentary", width: 40, help: "One line per amber or red, naming the action and owner."}
  rows:
    - ["AI systems registered (%)", KPI, "Registered / known to exist", "", "", "100", "", "", "", "", ""]
    - ["High-risk systems assessed (%)", KPI, "With current risk assessment", "", "", "100", "", "", "", "", ""]
    - ["Documentation complete (%)", KPI, "High-risk with current model card", "", "", "100", "", "", "", "", ""]
    - ["AI literacy completion (%)", KPI, "Relevant staff trained", "", "", "90", "", "", "", "", ""]
    - ["Control tests passed (%)", KPI, "Tested controls operating effectively", "", "", "95", "", "", "", "", ""]
    - ["Unregistered systems found", KRI, "Discovered outside the intake process", "", "", "0", "", "", "", "", ""]
    - ["Overdue high-risk reviews", KRI, "Past their review date", "", "", "0", "", "", "", "", ""]
    - ["Open high/critical risks past target", KRI, "Treatment not landing", "", "", "0", "", "", "", "", ""]
    - ["Exceptions open beyond expiry", KRI, "Silent policy erosion", "", "", "0", "", "", "", "", ""]
    - ["Human override rate (%)", KRI, "Decisions overridden by reviewers", "", "", "2-20", "", "", "", "", ""]
    - ["Incidents detected externally", KRI, "Found by someone outside the organisation", "", "", "0", "", "", "", "", ""]

ai-risk-assessment:
  sheet: Harms Assessment
  intro: >-
    Complete the prohibited-practice screen on the Screen tab FIRST. Any yes
    there stops the assessment. Assess harm to people before harm to the
    organisation.
  columns:
    - {name: "Harm type", width: 34, help: "The category of harm."}
    - {name: "Could it occur?", width: 15, choices: [Yes, "No", Possibly], help: "Be honest."}
    - {name: "Who is affected?", width: 28, help: "Which people, and are any of them vulnerable?"}
    - {name: "Severity", width: 11, choices: ["1", "2", "3", "4", "5"], help: "1 Negligible … 5 Severe."}
    - {name: "Likelihood", width: 12, choices: ["1", "2", "3", "4", "5"], help: "1 Rare … 5 Almost certain."}
    - {name: "Rating", width: 10, formula: "=IF(AND(ISNUMBER({Severity}),ISNUMBER({Likelihood})),{Severity}*{Likelihood},\"\")", help: "Severity x Likelihood. Calculated."}
    - {name: "Mitigation", width: 40, help: "What reduces it."}
    - {name: "Residual", width: 11, help: "After mitigation."}
    - {name: "Owner", width: 16, help: "Who owns the mitigation."}
  rows:
    - ["Discrimination / unfair outcome", "", "", "", "", "", "", "", ""]
    - ["Loss of opportunity (job, credit, service)", "", "", "", "", "", "", "", ""]
    - ["Financial loss", "", "", "", "", "", "", "", ""]
    - ["Physical or psychological harm", "", "", "", "", "", "", "", ""]
    - ["Privacy intrusion", "", "", "", "", "", "", "", ""]
    - ["Loss of autonomy or ability to contest", "", "", "", "", "", "", "", ""]
    - [Misinformation, "", "", "", "", "", "", "", ""]
    - ["Exclusion of a group", "", "", "", "", "", "", "", ""]
    - ["Regulatory exposure", "", "", "", "", "", "", "", ""]
    - ["Reputational damage", "", "", "", "", "", "", "", ""]
  extra_sheets:
    - name: Screen
      columns:
        - {name: "Prohibited practice screen — any Yes stops the assessment", width: 74}
        - {name: "Answer", width: 12, choices: [Yes, "No"]}
        - {name: "Notes", width: 40}
      rows:
        - ["Deploys subliminal, manipulative, or exploitative techniques", "", ""]
        - ["Exploits vulnerability by age, disability, or social/economic situation", "", ""]
        - ["Performs social scoring leading to unjustified detrimental treatment", "", ""]
        - ["Predicts criminal offending based solely on profiling or personality", "", ""]
        - ["Builds facial recognition databases by untargeted scraping", "", ""]
        - ["Infers emotion in the workplace or in education", "", ""]
        - ["Performs biometric categorisation to infer protected characteristics", "", ""]
        - ["Performs real-time remote biometric identification in public spaces", "", ""]
    - name: Oversight
      columns:
        - {name: "Question", width: 46}
        - {name: "Answer", width: 52}
      rows:
        - ["Who reviews the output?", ""]
        - ["What information do they see?", ""]
        - ["Can they realistically override? How?", ""]
        - ["How long do they have per decision?", ""]
        - ["How would we know if they were rubber-stamping?", ""]
        - ["What training have they had?", ""]
