# The 25 templates — single source of truth for page content, navigation,
# section index pages, status pills, and the "which template fixes this gap"
# links in the assessment report.
#
# Fields:
#   id            - stable slug. Referenced by questions.yml `templates`.
#   title         - page H1 and nav label
#   nav           - shorter label for the site navigation (optional)
#   section       - id from data/sections.yml
#   path          - path under docs/ (kept identical to the original site so no
#                   inbound links break)
#   status        - ready | draft | stub
#   purpose       - what it is for (1-3 sentences)
#   when_to_use   - trigger and cadence
#   how_to_use    - practical steps, SPECIFIC to this template
#   body          - the template itself, in Markdown
#   adaptation    - list of {context, note}, specific to this template
#   related       - other template ids
#
# Links inside `body` use {{id}} placeholders resolved by the build script to
# correct relative paths, so moving a page cannot produce a broken link.

# ===========================================================================
# FRAMEWORKS
# ===========================================================================

- id: data-governance-framework
  title: Data Governance Framework
  section: frameworks
  path: frameworks/data-governance-framework.md
  status: ready
  purpose: >-
    The reference that defines how your organisation governs data: what data you
    hold, who owns it, what quality is expected, and how decisions about it are
    made. It is the foundation the AI governance work sits on — most AI failures
    trace back to a data problem nobody owned.
  when_to_use: >-
    Adopt once, then review annually or when your data estate, regulatory
    exposure, or operating model changes materially.
  how_to_use: >-
    Start from section 3 (domains and ownership) rather than the top — naming
    owners is the hardest part and everything else depends on it. Get the domain
    list agreed before you write policy statements, or you will write rules
    nobody has agreed to enforce.
  body: |
    ### 1. Purpose & scope

    This framework sets out how **[Organisation]** governs data across its
    lifecycle — creation, storage, use, sharing, retention, and disposal. It
    applies to all data the organisation holds or processes, in all systems,
    including data held by third parties on our behalf.

    ### 2. Principles

    - **Ownership** — every significant data domain has one named accountable owner.
    - **Fitness for purpose** — quality is defined by what the data is used for,
      not in the abstract.
    - **Lawfulness** — we can point to a lawful basis for every processing activity.
    - **Minimisation** — we hold what we need, for as long as we need it.
    - **Transparency** — definitions, lineage, and quality are discoverable.
    - **Security by classification** — handling follows sensitivity (see
      {{data-classification-policy}}).
    - **Proportionality** — control effort scales with value and risk.

    ### 3. Data domains & ownership

    The estate is divided into domains, each with a named owner accountable for
    its definitions, quality, and access decisions.

    | Domain | Owner (role) | Steward | Systems of record | Classification |
    |---|---|---|---|---|
    | Customer | [role] | [name] | [system] | Confidential |
    | Employee | [role] | [name] | [system] | Confidential |
    | Financial | [role] | [name] | [system] | Restricted |
    | Product / operational | [role] | [name] | [system] | Internal |
    | [add domains] | | | | |

    Domains are recorded in the {{data-asset-register}}.

    ### 4. Roles

    | Role | Accountable for |
    |---|---|
    | **Data Owner** | Business accountability for a domain: definitions, access, quality targets, acceptance of risk. |
    | **Data Steward** | Day-to-day custody: definitions maintained, quality monitored, issues triaged. |
    | **Data Custodian** | Technical operation: storage, backup, access enforcement, security controls. |
    | **Consumers** | Using data within its stated purpose and classification. |
    | **Data Governance Committee** | Owns this framework; arbitrates cross-domain disputes. |

    Full detail in {{roles-responsibilities}} and {{raci}}.

    ### 5. Data quality

    Quality is measured against defined dimensions with thresholds per domain —
    see {{data-quality-standard}}. Owners are accountable for their domain's
    scores; breaches raise an issue in the {{incident-log}}.

    ### 6. Lifecycle & retention

    | Stage | Control |
    |---|---|
    | Create / acquire | Lawful basis confirmed; classified; registered. |
    | Store | Held in an approved system with controls matching classification. |
    | Use | Within stated purpose; secondary use re-assessed. |
    | Share | Agreement in place; recipient obligations flowed down. |
    | Retain | Per the retention schedule — **[reference]**. |
    | Dispose | Verifiable deletion; disposal recorded. |

    ### 7. How this connects to AI

    AI systems inherit the governance of the data they consume. Before a system
    enters development, its data sources must be registered, classified, and
    confirmed lawful for that purpose. See {{ai-governance-framework}} and
    {{ai-development-standard}}.

    ### 8. Compliance & exceptions

    Exceptions are requested from the data owner, recorded with an expiry date,
    and reported to the committee. Persistent exceptions indicate the rule is
    wrong — fix the rule.

    ### 9. Review

    | Version | Date | Author | Approved by | Next review |
    |---|---|---|---|---|
    | 0.1 | [date] | [name] | [committee] | [date] |
  adaptation:
    - context: Small organisations
      note: >-
        Collapse owner, steward, and custodian into one or two people, but keep
        the domain list — knowing what you hold matters more than the role split.
    - context: Regulated financial services
      note: >-
        Map domains to BCBS 239 risk data aggregation principles and align the
        quality dimensions with existing regulatory reporting controls.
    - context: Public sector
      note: >-
        Add a transparency and FOI dimension: openness by default, with
        classification as the exception rather than the reverse.
    - context: Data-mesh operating models
      note: >-
        Domain ownership maps naturally onto data products. Keep this framework
        as the federated policy layer and let domains own their own quality SLOs.
  related: [data-governance-policy, data-quality-standard, data-asset-register, ai-governance-framework]

- id: ai-governance-framework
  title: AI Governance Framework
  section: frameworks
  path: frameworks/ai-governance-framework.md
  status: ready
  purpose: >-
    A single reference that defines how your organisation governs AI across its
    lifecycle — who is accountable, what principles apply, how risk is tiered and
    controlled, and how it connects to data governance and the EU AI Act. It is
    the document you hand to a board, a regulator, or a new hire to explain "how
    we do AI here".
  when_to_use: >-
    Adopt it once, then review at least annually and whenever regulation, your
    risk appetite, or your AI footprint changes materially.
  how_to_use: >-
    Fill the bracketed placeholders, delete what does not apply, and ratify it
    through your governance committee. Keep it short enough that people actually
    read it — push detail down into the policies and standards it references.
  body: |
    ### 1. Purpose & scope

    This framework sets out how **[Organisation]** governs the design,
    procurement, development, deployment, and retirement of AI systems. It
    applies to **all** AI systems — built, bought, or embedded — used in or on
    behalf of the organisation, including general-purpose AI and AI features
    inside third-party products.

    ### 2. Principles

    - **Accountability** — a named human is accountable for every AI system.
    - **Lawfulness & fairness** — systems comply with applicable law and do not
      produce unjustified discriminatory outcomes.
    - **Transparency** — people are told when they interact with AI, and decisions
      can be explained proportionate to their impact.
    - **Human oversight** — meaningful human control exists over consequential
      decisions.
    - **Safety, security & robustness** — systems are tested, monitored, and
      secured across their lifecycle.
    - **Privacy & data governance** — data used by AI is governed, minimised, and
      lawful (see {{data-governance-framework}}).
    - **Proportionality** — controls scale with risk; low-risk innovation is not
      over-burdened.

    ### 3. Governance structure

    | Body / role | Mandate |
    |---|---|
    | **Board / Audit & Risk Committee** | Sets risk appetite; receives assurance. |
    | **AI / Data Governance Committee** | Owns this framework; approves high-risk use; resolves escalations. See {{committee-charter}}. |
    | **AI accountable owner (per system)** | Accountable for a specific system's compliance and outcomes. |
    | **Model / product teams** | Build and operate within standards. |
    | **Second line (Risk / Compliance / Legal / DPO)** | Independent challenge and advice. |
    | **Third line (Internal Audit)** | Independent assurance. |

    Detailed responsibilities are in {{raci}} and {{roles-responsibilities}}.

    ### 4. Risk tiering

    Every AI system is classified before deployment. Tiers align with the EU AI
    Act — see {{eu-ai-act-readiness-checklist}}.

    | Tier | Definition | Governance response |
    |---|---|---|
    | **Prohibited** | Practices banned under Art. 5 | Do not build or deploy. Screen at intake. |
    | **High-risk** | Annex I / III systems | Full controls: risk management, data governance, technical documentation, human oversight, conformity assessment, post-market monitoring. |
    | **Limited** | Transparency-triggering (chatbots, synthetic media) | Disclosure and labelling controls. |
    | **Minimal** | Everything else | Baseline standards; light-touch. |

    Classification is a recorded decision with a date and an owner, held in the
    {{ai-system-inventory}}. Re-classify on material change of purpose.

    ### 5. Lifecycle controls

    | Stage | Required before proceeding |
    |---|---|
    | **Ideation** | Screened against prohibited practices; risk tier assigned; entered in the inventory. |
    | **Development** | Data sources lawful and registered; {{ai-risk-assessment}} started; evaluation plan agreed. |
    | **Pre-deployment** | Assessment complete; {{model-card}} written; human oversight designed; accountable owner signs off. |
    | **Operation** | Monitoring live; logs retained; incidents routed to {{incident-log}}. |
    | **Retirement** | Decommissioned cleanly; records retained per schedule; inventory updated. |

    ### 6. Policies & standards under this framework

    - {{acceptable-ai-use-policy}}
    - {{ai-development-standard}}
    - {{third-party-ai-risk-policy}}
    - {{ai-risk-assessment}} and {{model-card}}

    ### 7. Reporting & assurance

    The committee reports to the board at least {{default:board-reporting-cadence}} using
    {{board-pack}} and tracks health via {{kpi-dashboard}}. Internal Audit
    provides independent assurance on a risk-based cycle.

    ### 8. Review

    Owner: **[role]**. Cadence: {{default:policy-review-cycle}}.

    | Version | Date | Author | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [name] | [committee] |
  adaptation:
    - context: Regulated financial services
      note: >-
        Map this framework to your model risk management standard (SR 11-7 style
        expectations) and to operational resilience obligations. Make the
        second/third-line split explicit and align tiering with model materiality.
    - context: Small organisations
      note: >-
        Collapse the committee and accountable-owner roles, but never remove the
        "named accountable human" principle — it is the one control that cannot
        be delegated to a process.
    - context: Non-EU
      note: >-
        Keep the risk-tiering logic and swap the EU AI Act references for your
        local regime (NIST AI RMF, ISO/IEC 42001). The structure holds; only the
        obligation names change.
    - context: Heavy GPAI / vendor use
      note: >-
        If you mostly buy rather than build, thin out section 5 and expand
        {{third-party-ai-risk-policy}} — your controls are contractual and
        assurance-based rather than engineering ones.
  related: [data-governance-framework, acceptable-ai-use-policy, ai-development-standard, ai-system-inventory]

- id: governance-charter
  title: Governance Charter
  section: frameworks
  path: frameworks/governance-charter.md
  status: draft
  purpose: >-
    A short, board-approved mandate that establishes the governance programme:
    why it exists, what authority it has, what it covers, and how success is
    measured. It is what you point to when someone asks "who says so?".
  when_to_use: >-
    Write it at the start of the programme and have it formally approved.
    Refresh when scope, sponsorship, or mandate changes.
  how_to_use: >-
    Keep it to two pages. The charter grants authority; it does not describe
    process. If you find yourself writing procedure, that belongs in the
    frameworks or the committee terms of reference instead.
  body: |
    ### 1. Mandate

    The **[Data & AI Governance Programme]** is established by **[the Board /
    Executive Committee]** on **[date]** to ensure that **[Organisation]**
    manages its data and AI assets lawfully, safely, and in line with its stated
    risk appetite.

    ### 2. Why this exists

    **[Two or three sentences: the specific driver. Regulatory exposure, a board
    concern, an incident, an AI adoption push. Be concrete — a charter that
    could belong to any organisation will be ignored by this one.]**

    ### 3. Scope

    **In scope:** all data held or processed by the organisation; all AI systems
    built, bought, or embedded; all business units and geographies **[amend]**.

    **Out of scope:** **[be explicit — e.g. security operations, covered by the
    existing security programme]**.

    ### 4. Authority

    The programme, through its committee, is authorised to:

    - Set mandatory standards for data and AI within scope.
    - Require registration and classification of any AI system.
    - **Halt or require remediation** of a system presenting unacceptable risk.
    - Require evidence of compliance from any team or vendor.
    - Escalate unresolved matters directly to **[the Board / Audit & Risk]**.

    !!! note "The halt right matters"
        A programme that cannot stop anything is advisory. If the authority to
        halt is not granted here, expect controls to be optional in practice.

    ### 5. Sponsorship & accountability

    | Role | Holder | Accountability |
    |---|---|---|
    | Executive Sponsor | [name] | Board-level accountability; resourcing. |
    | Programme Owner | [name] | Delivery of the programme. |
    | Committee Chair | [name] | Decision-making forum. |

    ### 6. Objectives & measures

    | Objective | Measure | Target | By |
    |---|---|---|---|
    | Complete AI inventory | % systems registered | 100% | [date] |
    | Risk classification | % classified | 100% | [date] |
    | Policy adoption | % staff attested | 90% | [date] |
    | Board visibility | Reports delivered | {{default:board-reports-per-year}} per year | Ongoing |

    ### 7. Resourcing

    **[Named roles and FTE commitment. A charter without resourcing is a
    statement of intent, not a mandate.]**

    ### 8. Review & approval

    | Version | Date | Approved by |
    |---|---|---|
    | 1.0 | [date] | [board / exco] |
  adaptation:
    - context: Small organisations
      note: >-
        One page is enough. The essential clauses are authority (section 4) and
        named sponsorship (section 5) — the rest can be inherited from the
        frameworks.
    - context: Group structures
      note: >-
        State clearly whether the charter binds subsidiaries directly or requires
        local adoption. Ambiguity here surfaces during the first cross-entity
        incident, at the worst possible moment.
    - context: Public sector
      note: >-
        Reference the statutory basis for the mandate and any duties owed to
        citizens; add a public transparency objective to section 6.
  related: [committee-charter, roles-responsibilities, ai-governance-framework, board-pack]

- id: maturity-assessment
  title: Maturity Assessment
  section: frameworks
  path: frameworks/maturity-assessment.md
  status: ready
  purpose: >-
    A structured baseline of how capable your governance actually is today,
    across the dimensions that matter, so you can prioritise honestly and show
    movement over time.
  when_to_use: >-
    At programme start, then every six to twelve months. Also useful immediately
    after an incident, when appetite for investment is briefly high.
  how_to_use: >-
    Score each dimension 0–4 against the descriptors, evidencing every score with
    something you could show an auditor. Score what is true, not what is
    intended — an optimistic baseline destroys the credibility of every later
    improvement you report.
  body: |
    ### Maturity levels

    | Level | Name | Description |
    |---|---|---|
    | **0** | Absent | Nothing in place. |
    | **1** | Initial | Ad hoc, individual effort, undocumented. |
    | **2** | Developing | Documented but inconsistently applied. |
    | **3** | Defined | Standardised, applied consistently, evidenced. |
    | **4** | Managed | Measured, reviewed, and improved on evidence. |

    ### Assessment

    Score each dimension. Record evidence — a score without evidence is an
    opinion.

    | # | Dimension | Score (0–4) | Evidence | Target | Owner |
    |---|---|---|---|---|---|
    | 1 | Governance mandate & sponsorship | | | | |
    | 2 | Committee & decision rights | | | | |
    | 3 | Roles & accountability (RACI) | | | | |
    | 4 | Policy & standards coverage | | | | |
    | 5 | Data ownership & domains | | | | |
    | 6 | Data quality management | | | | |
    | 7 | Data classification & handling | | | | |
    | 8 | AI inventory & classification | | | | |
    | 9 | AI risk assessment process | | | | |
    | 10 | Model documentation | | | | |
    | 11 | Human oversight design | | | | |
    | 12 | Third-party / vendor AI risk | | | | |
    | 13 | Incident management | | | | |
    | 14 | Control library & assurance | | | | |
    | 15 | Board reporting | | | | |
    | 16 | AI literacy & training | | | | |
    | 17 | Regulatory readiness (EU AI Act) | | | | |

    ### Interpreting the result

    | Average | Posture | What to do next |
    |---|---|---|
    | **0.0–1.0** | Early | Establish mandate, inventory, and prohibited-practice screening before anything else. |
    | **1.1–2.0** | Developing | Close policy and documentation gaps; stand up the committee properly. |
    | **2.1–3.0** | Established | Shift from writing documents to evidencing that controls operate. |
    | **3.1–4.0** | Advanced | Focus on measurement, independent assurance, and continuous improvement. |

    ### Heat map

    Plot dimension against score to show the board where the thin ice is. The
    pattern usually matters more than the average: a 3.5 average hiding a 0 on
    inventory is worse than a flat 2.

    ### Re-assessment

    | Date | Average | Movement | Notes |
    |---|---|---|---|
    | [date] | | Baseline | |
  adaptation:
    - context: Small organisations
      note: >-
        Drop dimensions 14 and 15 if you have no formal assurance function or
        board, and score the remaining 15. Do not score dimensions you have no
        realistic path to improving.
    - context: Regulated sectors
      note: >-
        Add dimensions for model validation independence and regulatory reporting
        accuracy, and align the level descriptors with your supervisor's own
        maturity language where one exists.
    - context: Using this with the assessment tool
      note: >-
        The role-based assessment scores obligation coverage; this scores
        organisational capability. They answer different questions — run both,
        and expect capability to lag coverage.
  related: [governance-charter, control-library, kpi-dashboard, board-pack]

