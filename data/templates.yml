- id: eu-ai-act-readiness-checklist
  title: EU AI Act — 25-point readiness checklist
  nav: Readiness Checklist (25-point)
  section: eu-ai-act
  path: eu-ai-act/readiness-checklist.md
  status: ready
  reviewed: 2026-08-02
  version: "1.1"
  generate_body: checklist
  purpose: >-
    A fast self-assessment of where your organisation stands against the EU AI
    Act. Work through it, mark what is true today, and treat every unticked box
    as a backlog item.
  when_to_use: >-
    As a first baseline, then quarterly, and again whenever you launch or
    materially change an AI system.
  how_to_use: >-
    Answer honestly rather than optimistically — an inflated baseline produces a
    plan that fixes the wrong things. Each item names the templates that close it.
    For a scored version tailored to your role, take the interactive assessment.
  adaptation:
    - context: Non-EU organisations
      note: >-
        The Act can still reach you where output is used in the EU. Work through
        the checklist anyway, then confirm scope with counsel — territorial reach
        is the question most often got wrong.
    - context: Deployers rather than providers
      note: >-
        Items 11–18 are mostly provider obligations, but you inherit exposure
        through what you deploy. Focus on 1–10 and 22–25, and press vendors on
        the rest via {{third-party-ai-risk-policy}}.
    - context: Using this with the assessment tool
      note: >-
        The interactive assessment covers these 25 points plus role-specific
        questions, and scores them by severity. This page is the reference; the
        tool is the working version.
  related: [eu-ai-act-timeline, ai-system-inventory, ai-risk-assessment, board-pack]

- id: eu-ai-act-timeline
  title: EU AI Act timeline (2026 Digital Omnibus)
  nav: Timeline (2026 Digital Omnibus)
  section: eu-ai-act
