- id: ai-risk-assessment
  title: AI Risk Assessment
  section: risk
  path: risk/ai-risk-assessment.md
  status: ready
  purpose: >-
    A structured assessment of what could go wrong with a specific AI system, how
    bad it would be, and what you are doing about it. For high-risk systems it is
    the core evidence that Art. 9 risk management is operating.
  when_to_use: >-
    Before development for high-risk systems, before deployment for all systems,
    and again on material change. Review live high-risk systems at least
    annually.
  how_to_use: >-
    Do it with the people who build and use the system, not about them. Assess
    risk to the people affected first and to the organisation second — that
    ordering is what the regulation expects, and it also surfaces the risks that
    later become reputational ones.
  body: |
    ### System under assessment

    | Field | Value |
    |---|---|
    | System ID / name | [AI-00X] |
    | Accountable owner | [name] |
    | Purpose | [what it does and what decisions it drives] |
    | Risk tier | [prohibited / high / limited / minimal] |
    | Affects individuals? | [yes / no — how] |
    | Assessment date / assessor | [date] / [name] |

    ### 1. Prohibited practice screen

    Answer first. Any "yes" stops the assessment.

    - [ ] Deploys subliminal, manipulative, or exploitative techniques
    - [ ] Exploits vulnerability by age, disability, or social/economic situation
    - [ ] Performs social scoring leading to unjustified detrimental treatment
    - [ ] Predicts criminal offending based solely on profiling or personality
    - [ ] Builds facial recognition databases by untargeted scraping
    - [ ] Infers emotion in the workplace or in education
    - [ ] Performs biometric categorisation to infer protected characteristics
    - [ ] Performs real-time remote biometric identification in public spaces

    **Any box ticked → do not proceed. Escalate immediately.**

    ### 2. Harms assessment

    Assess harm **to people** first.

    | Harm type | Could it occur? | Who is affected? | Severity | Likelihood | Rating |
    |---|---|---|---|---|---|
    | Discrimination / unfair outcome | | | | | |
    | Loss of opportunity (job, credit, service) | | | | | |
    | Financial loss | | | | | |
    | Physical or psychological harm | | | | | |
    | Privacy intrusion | | | | | |
    | Loss of autonomy or ability to contest | | | | | |
    | Misinformation | | | | | |
    | Exclusion of a group | | | | | |

    Then to the organisation: regulatory, financial, reputational, operational.

    !!! tip "Ask who is worst affected, not who is average"
        Aggregate accuracy hides concentrated harm. A system that is 95% accurate
        overall can be systematically wrong about one group — and that group is
        who will be harmed, and who will complain.

    ### 3. Technical risk

    | Area | Question | Assessment | Mitigation |
    |---|---|---|---|
    | Data quality | Is training data relevant, representative, current? | | |
    | Bias | Have you tested performance across subgroups? | | |
    | Accuracy | Does it meet the declared threshold? Where does it fail? | | |
    | Robustness | How does it behave on edge cases and adversarial input? | | |
    | Drift | How would you detect degradation? | | |
    | Explainability | Can you explain a decision to the person affected? | | |
    | Security | Injection, poisoning, extraction, leakage through output? | | |
    | Dependencies | What happens if the vendor or model changes? | | |

    ### 4. Human oversight

    | Question | Answer |
    |---|---|
    | Who reviews the output? | [named role] |
    | What information do they see? | |
    | Can they realistically override? How? | |
    | How long do they have per decision? | |
    | How would we know if they were rubber-stamping? | |
    | What training have they had? | |

    !!! warning "The rubber-stamp test"
        If a reviewer handles hundreds of decisions an hour, or overrides almost
        never, oversight is nominal. Measure override rates — a rate near zero is
        a warning sign, not a success metric.

    ### 5. Transparency

    - [ ] People are told they are interacting with, or subject to, AI
    - [ ] AI-generated content is marked where required
    - [ ] Affected people can obtain an explanation
    - [ ] **There is a route to contest a decision**, and someone staffs it

    ### 6. Residual risk and decision

    | Residual rating | Justification | Accepted by | Authority | Date |
    |---|---|---|---|---|
    | [low/med/high/critical] | | [name] | Per {{decision-rights}} | [date] |

    **Decision:** Proceed · Proceed with conditions · Do not proceed

    Conditions: **[list, with owners and dates]**

    ### 7. Review

    | Trigger | Action |
    |---|---|
    | Material change of purpose or data | Full reassessment |
    | Incident involving this system | Targeted reassessment |
    | Annually (high-risk) | Full review — see {{default:high-risk-review-cycle}} |
    | Vendor model change | Targeted reassessment |
  adaptation:
    - context: Small organisations
      note: >-
        Sections 1, 2, and 4 are the irreducible core: is it allowed, who could
        it hurt, and who is watching. That fits on two pages.
    - context: Regulated financial services
      note: >-
        Align with model risk management: add model validation findings, and
        treat this as a complement to, not a replacement for, independent
        validation.
    - context: Where a DPIA is also required
      note: >-
        Run them together and cross-reference. Section 2 harms feed the DPIA's
        risks-to-individuals directly — see {{processing-dpia-log}}.
    - context: Research and experimentation
      note: >-
        Apply a shortened version at experiment stage, and the full assessment
        before anything touches real users or real decisions.
  related: [ai-system-inventory, model-card, risk-register, processing-dpia-log]

- id: model-card
  title: Model Card / Model Risk Documentation
  nav: Model Card / Model Risk Doc
  section: risk
  path: risk/model-card.md
  status: ready
  purpose: >-
    Standard documentation for a model: what it is for, what it was trained on,
    how well it performs and for whom, and where it should not be used. Feeds
    both AI Act technical documentation and the instructions deployers rely on.
  when_to_use: >-
    Complete before deployment; update on retraining or material change. Required
    in practice for anything high-risk.
  how_to_use: >-
    Write the limitations section honestly and first. A model card that lists no
    limitations tells a reader either that you did not look, or that you are not
    telling them — and both undermine every other claim on the page.
  body: |
    ### Model details

    | Field | Value |
    |---|---|
    | Model name / version | |
    | System ID | [links to {{ai-system-inventory}}] |
    | Owner | [named] |
    | Type / architecture | |
    | Base model (if fine-tuned) | |
    | Training date | |
    | Licence / provenance | |

    ### Intended use

    **Intended to:** [specific tasks and context]

    **Intended users:** [who operates it]

    **Out of scope — do not use for:**

    - [specific uses that would be inappropriate]
    - [populations it was not trained for]
    - [decisions it must not make alone]

    !!! note "Out-of-scope is the section that prevents harm"
        Most AI failures come from a model used well outside what it was built
        for. Be specific enough that someone can recognise their own misuse case.

    ### Training data

    | Field | Value |
    |---|---|
    | Sources | [links to {{data-asset-register}}] |
    | Size and period covered | |
    | Personal data? | [and lawful basis] |
    | Preprocessing | |
    | Train / validation / test split | [method; leakage check] |
    | Known gaps or skews | |
    | Representativeness assessment | [vs. affected population] |

    ### Performance

    | Metric | Overall | Notes |
    |---|---|---|
    | [Accuracy / F1 / AUC] | | |
    | [Precision] | | |
    | [Recall] | | |

    **Performance across groups** — the section that matters most:

    | Group | Metric | Result | Gap vs. overall |
    |---|---|---|---|
    | [group A] | | | |
    | [group B] | | | |

    Evaluation date, dataset, and method: **[record so results are reproducible]**

    ### Limitations & failure modes

    - **Known failure modes:** [where it goes wrong, and how it looks when it
      does]
    - **Uncertainty:** [does it signal low confidence? is that signal reliable?]
    - **Drift sensitivity:** [what changes in the world degrade it]
    - **Adversarial exposure:** [how it can be manipulated]

    ### Human oversight

    | Field | Value |
    |---|---|
    | Oversight design | [how a human reviews] |
    | Override mechanism | [how, and by whom] |
    | Expected review effort | [time per decision] |
    | Escalation route | |

    ### Monitoring

    | What | How | Threshold | Owner | Action if breached |
    |---|---|---|---|---|
    | Accuracy | | | | |
    | Subgroup performance | | | | |
    | Input drift | | | | |
    | Override rate | | | | |

    ### Ethical & legal considerations

    Fairness assessment · DPIA reference · Environmental cost, if material ·
    Third-party dependencies

    ### Version history

    | Version | Date | Change | Retrained? | Approved by |
    |---|---|---|---|---|
    | 1.0 | [date] | Initial release | — | [name] |
  adaptation:
    - context: Bought models
      note: >-
        Complete what you can from vendor documentation and record explicitly
        what they would not tell you. The gaps are themselves a risk finding to
        raise under {{third-party-ai-risk-policy}}.
    - context: LLM / GPAI applications
      note: >-
        Replace the training-data section with prompt, retrieval, and grounding
        configuration; document system prompts, guardrails, and evaluation of
        typical failure modes such as hallucination and injection.
    - context: Regulated financial services
      note: >-
        Extend into a full model risk document: assumptions, conceptual soundness,
        independent validation findings, and ongoing performance monitoring.
    - context: Non-technical readers
      note: >-
        Keep a one-paragraph plain-English summary at the top. Boards and DPOs
        read that; they do not read the metrics table.
  related: [ai-development-standard, ai-risk-assessment, ai-system-inventory, data-quality-standard]

- id: control-library
  title: Control Library & Assurance Map
  nav: Control Library & Assurance Map
  section: risk
  path: risk/control-library.md
  status: ready
  purpose: >-
    Maps obligations to the controls that satisfy them, names an owner for each,
    and records how you would evidence the control is operating. It turns "we
    have a policy" into "here is what we do and how you can check".
  when_to_use: >-
    Build once the frameworks exist, then use it to plan assurance and to answer
    regulator and auditor questions efficiently.
  how_to_use: >-
    Start from obligations and work outwards to controls, not from your existing
    controls inwards. Working the other way finds only the obligations you happen
    to already cover, which is precisely the wrong direction for gap analysis.
  body: |
    ### Structure

    | Element | Meaning |
    |---|---|
    | **Obligation** | The requirement — regulatory, contractual, or internal |
    | **Control** | What you do to satisfy it |
    | **Type** | Preventive / detective / corrective |
    | **Frequency** | Continuous, per-event, or periodic |
    | **Owner** | Named, first line |
    | **Evidence** | What you would show to prove it operated |
    | **Assurance** | Who checks, and how often |

    ### Control library

    | ID | Obligation | Control | Type | Freq. | Owner | Evidence | Assurance |
    |---|---|---|---|---|---|---|---|
    | C-01 | Art. 5 — prohibited practices | Intake screen at G1 blocks prohibited use cases | Preventive | Per system | Gov Lead | Screening record in inventory | 2L quarterly sample |
    | C-02 | Art. 6 — classification | Every system classified with recorded rationale before build | Preventive | Per system | Gov Lead | {{ai-system-inventory}} | 2L quarterly |
    | C-03 | Art. 9 — risk management | Risk assessment completed and reviewed for high-risk systems | Preventive | Per system + annual | AI Owner | {{ai-risk-assessment}} | 3L annual |
    | C-04 | Art. 10 — data governance | Training data assessed for relevance, representativeness, bias | Preventive | Per model | ML Lead | Data quality report | 2L per release |
    | C-05 | Art. 11 — documentation | Model card completed before deployment | Preventive | Per model | ML Lead | {{model-card}} | 3L annual |
    | C-06 | Art. 12 — logging | Automatic logging enabled and retained | Detective | Continuous | Tech Owner | Log configuration; retention proof | 2L quarterly |
    | C-07 | Art. 14 — human oversight | Reviewer workflow with override; override rates monitored | Preventive | Continuous | Product Owner | Override metrics | 2L quarterly |
    | C-08 | Art. 15 — accuracy & security | Evaluation and adversarial testing before release | Preventive | Per release | ML Lead | Test results | 3L annual |
    | C-09 | Art. 50 — transparency | AI disclosure present in user-facing surfaces | Preventive | Per release | Product Owner | UI evidence | 2L sample |
    | C-10 | Art. 72/73 — monitoring & incidents | Monitoring live; incident route defined and tested | Detective | Continuous | Gov Lead | {{incident-log}} | 3L annual |
    | C-11 | Art. 4 — AI literacy | Role-appropriate training delivered and tracked | Preventive | Annual | HR | Completion records | 2L annual |
    | C-12 | Art. 26 — vendor obligations | Vendor assessment and contract clauses in place | Preventive | Per vendor | Procurement | Assessment; contract | 2L annual |
    | C-13 | GDPR Art. 35 — DPIA | DPIA completed before high-risk processing | Preventive | Per activity | DPO | {{processing-dpia-log}} | 3L annual |

    ### Assurance map

    Shows who checks what, and exposes obligations nobody is assuring.

    | Obligation area | 1L — does it | 2L — challenges | 3L — assures | Gaps |
    |---|---|---|---|---|
    | Prohibited practices | Product / ML | Governance | Audit | |
    | Classification | Gov Lead | Legal | Audit | |
    | Risk management | AI Owners | Risk | Audit | |
    | Data governance | Data Owners | Governance | Audit | |
    | Documentation | ML teams | Governance | Audit | |
    | Human oversight | Product | Governance | Audit | |
    | Transparency | Product | Legal | Audit | |
    | Third party | Procurement | Security / Legal | Audit | |
    | Literacy | HR | Governance | Audit | |

    !!! tip "Look for the blank cells"
        The value of this map is where a column is empty. An obligation with a
        first line but no assurance is a control you are trusting without ever
        checking.

    ### Control testing

    | Test type | What it answers |
    |---|---|
    | **Design** | Would this control work if it operated as described? |
    | **Operating effectiveness** | Did it actually operate, over the period? |

    Test controls on this cycle: {{default:control-test-cycle}}
    Record failures in the {{incident-log}} and the {{risk-register}}.
  adaptation:
    - context: Small organisations
      note: >-
        Controls C-01, C-02, C-05, and C-07 give you the most coverage for the
        least effort. Self-assessment substitutes for a third line, but say so
        openly rather than implying independence you do not have.
    - context: Existing GRC tooling
      note: >-
        Load these as a control set in the tool you already have rather than
        maintaining a separate spreadsheet.
    - context: ISO/IEC 42001 or NIST AI RMF
      note: >-
        Add a column mapping each control to the corresponding clause or
        function, so a single control satisfies several frameworks and you test
        it once.
  related: [ai-risk-assessment, risk-register, incident-log, maturity-assessment]

