- id: board-pack
  title: Board Pack Template
  section: board
  path: board/board-pack.md
  status: ready
  purpose: >-
    A structured report that gives the board what it needs to discharge its
    oversight duty: current posture, what changed, what went wrong, and what
    decisions are being asked of them.
  when_to_use: >-
    Every board or risk committee cycle — typically quarterly. Also for an
    extraordinary session after a serious incident.
  how_to_use: >-
    Write the first page so it stands alone; assume it is the only page some
    members read. Lead with decisions being sought, not with activity completed.
    Boards do not need to know how busy you were.
  body: |
    ---

    ## Data & AI Governance — Board Report

    **Period:** [Q_ 20__] · **Prepared by:** [name] · **Date:** [date] ·
    **Classification:** [Confidential]

    ### 1. Executive summary

    **Overall posture:** 🟢 Green / 🟡 Amber / 🔴 Red

    [Three or four sentences. Where we stand, the single most important thing
    that changed, and the most important thing the board should worry about.]

    **Decisions sought this session:**

    1. [Decision] — see section 7
    2. [Decision]

    ### 2. Risk posture

    | Risk | Rating | Movement | Owner | Commentary |
    |---|---|---|---|---|
    | [Top risk] | High | ↑ | [name] | [one line] |
    | [Risk] | Medium | → | [name] | |
    | [Risk] | Medium | ↓ | [name] | |

    **Appetite:** [within / outside] appetite. [If outside: what is being done,
    and by when.]

    ### 3. What changed this period

    | Area | Change | Implication |
    |---|---|---|
    | AI estate | [X new systems; Y retired] | |
    | Regulation | [milestones reached or approaching] | |
    | Policy | [adopted or revised] | |
    | Capability | [people, tooling, training] | |

    ### 4. Incidents

    | ID | Severity | Summary | Status | Reportable? | Lesson |
    |---|---|---|---|---|---|
    | INC-00X | S2 | [one line] | Closed | No | [what changed] |

    [If none: "No S1 or S2 incidents this period." Say it explicitly — silence
    reads as an omission.]

    ### 5. EU AI Act readiness

    **Readiness: [X]%** ([n] of [m] obligations met) — [↑ from Y% last period]

    | Area | Status | Gap | Action | By |
    |---|---|---|---|---|
    | Inventory & classification | 🟢 | — | — | — |
    | Risk management | 🟡 | [gap] | [action] | [date] |
    | Documentation | 🔴 | [gap] | [action] | [date] |
    | Transparency | 🟡 | [gap] | [action] | [date] |

    **Next milestone:** [date] — [obligation]. **[On / off] track.**

    ### 6. Metrics

    | Metric | Now | Last | Target | Trend |
    |---|---|---|---|---|
    | AI systems registered | | | 100% | |
    | High-risk systems assessed | | | 100% | |
    | Documentation complete | | | 100% | |
    | Staff trained (AI literacy) | | | [90%] | |
    | Open high risks | | | {{default:open-high-risk-target}} | |

    Full detail in {{kpi-dashboard}}.

    ### 7. Decisions sought

    | # | Decision | Recommendation | Rationale | Impact if deferred |
    |---|---|---|---|---|
    | 1 | [e.g. approve additional resource] | Approve | [why] | [consequence] |

    ### 8. Appendices

    A. Risk register extract · B. AI inventory summary ·
    C. Regulatory horizon · D. Incident detail

    ---

    !!! tip "Two tests before you send it"
        **The one-page test:** does page one alone tell a director what to worry
        about and what to decide?
        **The "so what" test:** every number should imply an action. If a metric
        implies nothing, cut it.
  adaptation:
    - context: Small organisations
      note: >-
        Sections 1, 2, 4, and 7 are enough. Two pages that get read beat eight
        that get skimmed.
    - context: Regulated sectors
      note: >-
        Add a supervisory engagement section — open queries, commitments made,
        deadlines — and align RAG definitions with your enterprise risk
        framework.
    - context: First report to a board
      note: >-
        Spend a paragraph on what AI governance is and why the board is
        accountable. Do not assume the mandate is understood; establishing it is
        half the value of the first pack.
    - context: Using the assessment tool
      note: >-
        Run the assessment with the Board audience selected and export it — it
        produces section 5 and much of section 2 directly.
  related: [kpi-dashboard, risk-register, committee-charter, maturity-assessment]

- id: kpi-dashboard
  title: KPI / KRI Dashboard
  section: board
  path: board/kpi-dashboard.md
  status: ready
  purpose: >-
    The measures that show whether governance is actually working — coverage,
    quality, timeliness, and leading indicators of trouble — rather than how much
    documentation exists.
  when_to_use: >-
    Report every cycle. Review the metric set annually and drop anything that has
    never changed a decision.
  how_to_use: >-
    Choose eight to twelve measures maximum and hold them stable, because trend
    is the point. Distinguish KPIs (is it working?) from KRIs (is something about
    to go wrong?) — most dashboards have far too few of the latter.
  body: |
    ### Coverage KPIs

    Are we governing everything we should be?

    | Metric | Definition | Target | Source |
    |---|---|---|---|
    | AI systems registered | Registered ÷ known to exist | 100% | {{ai-system-inventory}} |
    | Systems classified | With recorded tier and rationale | 100% | Inventory |
    | High-risk assessed | With current {{ai-risk-assessment}} | 100% | Assessments |
    | Documentation complete | High-risk with current {{model-card}} | 100% | Model cards |
    | Data assets registered | Material assets registered | [90%] | {{data-asset-register}} |
    | Vendors assessed | Critical AI vendors with current assessment | 100% | Vendor register |

    ### Effectiveness KPIs

    Is it working, rather than merely present?

    | Metric | Definition | Target | Why |
    |---|---|---|---|
    | Assessment cycle time | Intake to decision, median days | {{default:assessment-cycle-time-target}} | Slow governance gets bypassed |
    | Gate pass rate first time | % passing without rework | {{default:gate-pass-rate-target}} | Low means unclear standards |
    | Data quality score | Weighted across key domains | [> 95%] | {{data-quality-standard}} |
    | AI literacy completion | Relevant staff trained | [> 90%] | Art. 4 obligation |
    | Control tests passed | Tested controls operating effectively | [> 95%] | {{control-library}} |

    ### Risk indicators (KRIs)

    Leading signals that something is going wrong.

    | Indicator | Threshold | Why it matters |
    |---|---|---|
    | Unregistered systems found | Any | Governance is being bypassed |
    | Overdue high-risk reviews | > 0 | Assessments going stale |
    | Open high/critical risks past target | > 0 | Treatment is not landing |
    | Exceptions open beyond expiry | > 0 | Silent policy erosion |
    | **Human override rate** | {{default:override-rate-band}} | Too low = rubber-stamping; too high = model not fit |
    | Model drift alerts | Any unresolved | Performance degrading |
    | Incidents detected externally | Any | Monitoring is not working |
    | Mean time to detect | Increasing | Detection is degrading |

    !!! tip "Override rate is the single best oversight metric"
        It is one of the few numbers that reveals whether human oversight is real.
        A rate near zero almost always means reviewers are approving by default,
        not that the model is perfect.

    ### Presentation

    | Element | Guidance |
    |---|---|
    | RAG status | Define thresholds once and keep them fixed |
    | Trend arrows | Direction matters more than level |
    | Sparklines | Show the last 4–6 periods |
    | Commentary | One line per amber or red, naming the action and owner |

    ### Dashboard summary

    | Metric | Now | Last | Trend | Target | RAG | Commentary |
    |---|---|---|---|---|---|---|
    | AI systems registered | | | | 100% | | |
    | High-risk assessed | | | | 100% | | |
    | Documentation complete | | | | 100% | | |
    | AI literacy | | | | 90% | | |
    | Open high risks | | | | 0 | | |
    | Override rate | | | | 2–20% | | |

    ### Metrics to avoid

    | Avoid | Why | Use instead |
    |---|---|---|
    | Policies published | Measures activity, not effect | Attestation and exception rates |
    | Training hours delivered | Time is not competence | Assessment pass rates |
    | Number of meetings | Effort, not outcome | Decisions made and actions closed |
    | Total AI systems | Growth is not risk | Systems by tier, unassessed count |
  adaptation:
    - context: Small organisations
      note: >-
        Six metrics is plenty: registered, assessed, documented, trained, open
        high risks, and override rate.
    - context: Early-stage programmes
      note: >-
        Coverage metrics first — you cannot measure effectiveness of controls you
        have not yet applied everywhere. Expect coverage to look bad initially;
        that is the honest baseline.
    - context: Mature programmes
      note: >-
        Shift emphasis to KRIs and control-testing results. Coverage at 100% for
        four quarters running has stopped telling you anything.
  related: [board-pack, control-library, maturity-assessment, risk-register]

