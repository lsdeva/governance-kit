- id: raci
  title: RACI Matrix
  section: operating-model
  path: operating-model/raci.md
  status: ready
  purpose: >-
    Removes ambiguity about who does what. For every significant governance
    activity it names exactly one accountable party, so decisions have an owner
    and gaps become visible before they become incidents.
  when_to_use: >-
    Agree it when you stand up the operating model, and revisit whenever roles
    change or an escalation reveals that nobody owned something.
  how_to_use: >-
    Fill it in a room with the actual people, not in a document sent round for
    comment — the value is in the argument about who is accountable. Enforce one
    A per row. If two functions both claim accountability, you have found a
    problem worth resolving now rather than during an incident.
  body: |
    ### Legend

    | Letter | Meaning |
    |---|---|
    | **R** | Responsible — does the work |
    | **A** | Accountable — answerable for the outcome (**exactly one per row**) |
    | **C** | Consulted — input sought before the decision |
    | **I** | Informed — told after the decision |

    ### Matrix

    Columns are illustrative roles. Replace with your own.

    | Activity | Board | Committee | Gov Lead | Data Owner | AI Owner | ML Team | Legal/DPO | Security | Audit |
    |---|---|---|---|---|---|---|---|---|---|
    | **Strategy & mandate** | | | | | | | | | |
    | Approve governance charter | **A** | R | R | C | C | I | C | C | I |
    | Set risk appetite | **A** | R | C | C | C | I | C | C | I |
    | Approve frameworks & policies | I | **A** | R | C | C | C | C | C | I |
    | **Inventory & classification** | | | | | | | | | |
    | Maintain AI inventory | I | I | **A** | C | R | R | I | C | I |
    | Classify AI system risk tier | I | C | **A** | C | R | C | C | C | I |
    | Maintain data asset register | I | I | **A** | R | I | C | C | C | I |
    | **Risk** | | | | | | | | | |
    | Screen for prohibited practices | I | C | **A** | I | R | R | C | I | I |
    | Complete AI risk assessment | I | C | C | C | **A** | R | C | C | I |
    | Accept residual risk (high-risk) | I | **A** | R | C | C | I | C | C | I |
    | Maintain risk register | I | C | **A** | R | R | C | C | C | I |
    | **Build & deploy** | | | | | | | | | |
    | Approve data for training | I | I | C | **A** | C | R | C | C | I |
    | Produce model documentation | I | I | C | I | **A** | R | C | I | I |
    | Approve deployment (high-risk) | I | **A** | R | C | R | C | C | C | I |
    | Design human oversight | I | C | C | I | **A** | R | C | I | I |
    | **Third party** | | | | | | | | | |
    | Assess vendor AI risk | I | I | C | C | C | C | C | **A** | I |
    | Negotiate AI contract terms | I | I | C | C | C | I | **A** | R | I |
    | **Operate** | | | | | | | | | |
    | Monitor performance & drift | I | I | C | I | **A** | R | I | C | I |
    | Manage AI incidents | I | C | R | C | R | R | C | **A** | I |
    | Report serious incident to authority | I | C | R | I | C | I | **A** | C | I |
    | **Assurance** | | | | | | | | | |
    | Report to board | **A** | R | R | I | I | I | C | C | C |
    | Independent assurance | I | C | I | I | I | I | I | I | **A** |

    ### Validation

    Before you sign it off, check:

    - [ ] Every row has **exactly one A**. Two means nobody.
    - [ ] Nobody is A on so many rows that it is not credible.
    - [ ] Every A has the authority and budget to actually deliver.
    - [ ] Rows with many Cs are reviewed — over-consultation is how decisions
          stall.
    - [ ] Each named role has a real person behind it today.

    !!! tip "The test that matters"
        Pick a row and ask the person marked A to describe what they would do if
        it went wrong tomorrow. If they cannot, the matrix is aspirational.
  adaptation:
    - context: Small organisations
      note: >-
        Collapse to four columns — Exec, Governance Lead, Delivery, Independent
        review. One person may hold several, which is fine as long as the
        accountability split is conscious and written down.
    - context: Three lines of defence
      note: >-
        Keep first line (own and manage), second line (challenge and advise), and
        third line (assure) strictly separated in the A column. The same function
        should never both perform and assure an activity.
    - context: Federated / multi-entity
      note: >-
        Add a column per entity, or produce one matrix per entity with a shared
        group-level row set, so local accountability is explicit.
  related: [roles-responsibilities, decision-rights, committee-charter]

- id: committee-charter
  title: Committee Charter (Terms of Reference)
  nav: Committee Charter (ToR)
  section: operating-model
  path: operating-model/committee-charter.md
  status: ready
  purpose: >-
    Establishes the forum where governance decisions are actually made: its
    authority, membership, quorum, cadence, and what it must decide rather than
    merely discuss.
  when_to_use: >-
    When standing up the committee, then reviewed annually. Revisit if meetings
    routinely fail to reach decisions.
  how_to_use: >-
    Be specific about decision rights and quorum. The most common failure is a
    committee that discusses at length and decides nothing, because nobody
    established what it is empowered to settle on its own.
  body: |
    ### 1. Purpose

    The **[Data & AI Governance Committee]** is the decision-making forum for
    data and AI governance at **[Organisation]**, established under
    {{governance-charter}}.

    ### 2. Authority

    The committee is authorised to:

    - Approve frameworks, policies, and standards within its scope.
    - Approve or refuse deployment of **high-risk** AI systems.
    - **Require remediation, or suspend a system**, where risk is unacceptable.
    - Approve exceptions to policy, with expiry dates.
    - Escalate to **[the Board / Audit & Risk Committee]**.

    Matters reserved to the Board: **[risk appetite, charter changes, matters
    above [threshold]]**.

    ### 3. Membership

    | Role | Member | Voting? |
    |---|---|---|
    | Chair | [Exec sponsor] | Yes |
    | Governance Lead | [name] | Yes |
    | Data Owner representative | [name] | Yes |
    | Technology / ML lead | [name] | Yes |
    | Legal / DPO | [name] | Yes |
    | Security | [name] | Yes |
    | HR / People | [name] | Yes |
    | Internal Audit | [name] | **No — observer** |

    !!! note "Audit observes, never votes"
        If Internal Audit votes on a control, it cannot later provide independent
        assurance over that control. Keep the third line out of the decision.

    ### 4. Quorum & decisions

    - **Quorum:** {{default:committee-quorum}}.
    - **Decisions:** by consensus where possible; otherwise a majority of voting
      members present. The Chair holds a casting vote.
    - **Dissent is minuted.** A member who disagrees with a risk acceptance has
      it recorded by name.
    - **Out of cycle:** urgent decisions by **[written procedure with 48h
      response]**, ratified at the next meeting.

    ### 5. Cadence & agenda

    Meets {{default:committee-cadence}}. Standing agenda:

    1. Minutes and actions outstanding
    2. New AI systems for classification or approval
    3. Risk register — new, changed, and escalated items
    4. Incidents since last meeting
    5. Policy exceptions requested and expiring
    6. Regulatory horizon (EU AI Act milestones)
    7. Metrics — see {{kpi-dashboard}}
    8. Decisions required
    9. AOB

    ### 6. Papers

    Circulated {{default:papers-deadline}} in advance. Papers arriving late are
    deferred by default — otherwise deadlines get managed by ambushing the
    committee.

    ### 7. Reporting

    Reports to **[the Board]** {{default:board-reporting-cadence}} using {{board-pack}}. Minutes are
    retained for {{default:log-retention}} as evidence of governance.

    ### 8. Review

    | Version | Date | Approved by | Next review |
    |---|---|---|---|
    | 0.1 | [date] | [board] | [date] |
  adaptation:
    - context: Small organisations
      note: >-
        A standing 45-minute item on an existing leadership meeting, with real
        minutes, beats a separate committee that quietly stops meeting.
    - context: Regulated sectors
      note: >-
        Align composition and reporting lines with your existing risk committee
        structure, and check whether any member must be independent by rule.
    - context: Global organisations
      note: >-
        Consider regional sub-committees with a group committee for policy and
        escalation, and state clearly which decisions cannot be taken locally.
  related: [governance-charter, decision-rights, raci, board-pack]

- id: roles-responsibilities
  title: Roles & Responsibilities
  section: operating-model
  path: operating-model/roles-responsibilities.md
  status: ready
  purpose: >-
    Defines each governance role in enough detail that it can be put in a job
    description, recruited for, and assessed against — rather than assumed.
  when_to_use: >-
    Alongside the RACI, when appointing people into roles, and during
    onboarding.
  how_to_use: >-
    For each role, name a real person and confirm they know they hold it. The
    most common finding in a first governance audit is a role defined on paper
    that its supposed holder has never heard of.
  body: |
    ### Data roles

    #### Data Owner

    **Accountable for** a data domain's definitions, quality, access, and risk.

    - Approves access to the domain, particularly Restricted data.
    - Sets and monitors quality thresholds per {{data-quality-standard}}.
    - Accepts or escalates risk relating to the domain.
    - Approves use of the domain's data for AI training.

    **Typically held by:** the senior business leader who owns the process the
    data comes from — not IT, and not the team who happens to store it.

    #### Data Steward

    **Responsible for** day-to-day custody of a domain.

    - Maintains business definitions and the data catalogue entry.
    - Monitors quality and triages issues.
    - First point of contact for questions about the data's meaning.

    #### Data Custodian

    **Responsible for** technical operation: storage, backup, access enforcement,
    encryption, and monitoring. Usually sits in engineering or platform.

    ### AI roles

    #### AI Accountable Owner (per system)

    **Accountable for** one AI system's outcomes and compliance across its whole
    lifecycle.

    - Ensures classification, assessment, and documentation are complete.
    - Signs off deployment and material change.
    - Owns monitoring, incidents, and eventual retirement.
    - **Answerable if the system causes harm.**

    !!! warning "This role cannot be a committee"
        Every AI system needs one named human. If your answer to "who is
        accountable for this system?" is a team name, you do not yet have an
        accountable owner.

    #### Model Developer / ML Engineer

    **Responsible for** building within {{ai-development-standard}}: documenting
    data, evaluating performance and bias, producing the {{model-card}}, and
    raising risks they discover rather than routing around them.

    #### Product Owner

    **Responsible for** the use case: whether the system should exist, how it
    affects users, transparency to those users, and designing oversight that
    works in the real workflow.

    ### Governance & assurance roles

    #### Governance Lead

    **Accountable for** the programme: maintaining frameworks and registers,
    running the committee, reporting, and driving remediation. The role that
    makes governance an operating function rather than a document set.

    #### Legal / DPO

    **Responsible for** lawfulness: regulatory interpretation, DPIAs, lawful
    basis, contracts, and the independence to say no. Note that a DPO's statutory
    independence limits how far they can also own delivery.

    #### Security

    **Responsible for** protecting systems and data, including AI-specific
    threats — see {{control-library}}.

    #### Internal Audit

    **Accountable for** independent assurance. Must not have designed or operated
    the controls being assured.

    ### Appointment record

    | Role | Holder | Appointed | Deputy | Confirmed aware |
    |---|---|---|---|---|
    | Governance Lead | [name] | [date] | [name] | [ ] |
    | Data Owner — [domain] | [name] | [date] | [name] | [ ] |
    | AI Accountable Owner — [system] | [name] | [date] | [name] | [ ] |
  adaptation:
    - context: Small organisations
      note: >-
        One person may hold several roles. The only combination to avoid is
        someone assuring their own work — keep independent review genuinely
        independent, even if that means an external reviewer once a year.
    - context: Regulated financial services
      note: >-
        Map these to your senior management regime responsibilities, and check
        whether any of them must be held by a certified or approved person.
    - context: Where a statutory DPO exists
      note: >-
        The DPO advises and monitors; they should not also own the processing
        decisions they oversee, as that compromises the independence the role
        requires.
  related: [raci, decision-rights, committee-charter, governance-charter]

- id: decision-rights
  title: Decision Rights & Escalation
  section: operating-model
  path: operating-model/decision-rights.md
  status: ready
  purpose: >-
    States who can decide what, at what threshold, and what happens when people
    disagree or a decision is needed urgently. It is the document that stops
    governance stalling.
  when_to_use: >-
    With the operating model. Test it after the first real escalation, and again
    after the first urgent out-of-hours decision.
  how_to_use: >-
    Set thresholds in concrete terms — money, number of people affected, data
    classification — not adjectives like "significant". Then walk a real past
    decision through it and see whether the answer it gives matches what actually
    happened.
  body: |
    ### 1. Decision authority

    | Decision | Authority | Consult | Escalate if |
    |---|---|---|---|
    | Deploy a **minimal-risk** AI system | AI Accountable Owner | Gov Lead | Classification is disputed |
    | Deploy a **limited-risk** AI system | Gov Lead | Legal, Security | Customer-facing |
    | Deploy a **high-risk** AI system | **Committee** | Legal, Security, Audit | Board threshold met |
    | Approve a **prohibited-practice** exception | **Not available** | — | Prohibited means prohibited |
    | Use personal data for training | Data Owner + DPO | Gov Lead | Special category data |
    | Accept residual risk — low / medium | AI Accountable Owner | Gov Lead | — |
    | Accept residual risk — high | **Committee** | Legal, Security | {{default:residual-risk-committee-threshold}} |
    | Accept residual risk — critical | **Board** | Committee | — |
    | Approve a new AI vendor | Gov Lead | Security, Legal | Critical tier |
    | Policy exception ≤ {{default:exception-expiry}} | Gov Lead | Owner | Repeat request |
    | Policy exception > {{default:exception-expiry}} | **Committee** | Legal | — |
    | **Suspend a live AI system** | AI Owner, Gov Lead, **or** Security | Notify Committee within 24 hours | Always report |

    !!! danger "Suspension must be fast and blameless"
        Any of three roles can stop a system, and none of them needs permission
        first. If stopping a system requires a committee meeting, it will not
        happen in time. Notification comes after the stop, never before.

    ### 2. Escalation thresholds

    Escalate to the **Committee** when any is true:

    - Risk is rated **high** or above after mitigation.
    - Personal data of {{default:board-escalation-people-threshold}}
    - The system makes or materially informs decisions about individuals.
    - Two functions disagree and cannot resolve it within {{default:tool-approval-turnaround}}.
    - An exception is requested for the second time.

    Escalate to the **Board** when any is true:

    - Residual risk is **critical**.
    - Regulatory notification is likely or required.
    - Potential impact exceeds **[£X]** or affects **[X]** customers.
    - Reputational exposure is material.

    ### 3. Disagreement

    1. **Resolve locally** — the two parties, within 5 working days.
    2. **Governance Lead facilitates** — within 5 further days.
    3. **Committee decides** — at the next meeting, or by written procedure.
    4. **Board** — where the committee cannot agree or the threshold is met.

    The dissenting position is **recorded in the minutes by name**. People are far
    more willing to raise concerns when disagreement is documented rather than
    absorbed.

    ### 4. Urgent decisions

    | Situation | Who can act | Ratification |
    |---|---|---|
    | Live incident, harm occurring | Any of AI Owner / Gov Lead / Security — **act first** | {{default:urgent-ratification-window}} |
    | Regulatory deadline | Gov Lead + Legal | Next meeting |
    | Out of hours | **[on-call role]** | Next working day |

    ### 5. Recording

    Every decision at committee level or above records: decision, date, who
    decided, rationale, dissent, and review date. This is the evidence trail a
    regulator asks for.

    ### 6. Review

    Test annually against real decisions taken. If people routinely go around the
    matrix, the matrix is wrong — fix the matrix, not the people.
  adaptation:
    - context: Small organisations
      note: >-
        Two levels are enough — an operational decision-maker and an escalation
        point. Keep the suspension right distributed regardless of size.
    - context: Regulated sectors
      note: >-
        Align thresholds with existing risk acceptance limits so you do not run
        two incompatible sets of numbers.
    - context: Fast-moving product teams
      note: >-
        Set generous authority at the minimal and limited tiers so governance is
        not the bottleneck, and spend the control effort on high-risk instead.
  related: [raci, committee-charter, roles-responsibilities, risk-register]

# ===========================================================================
# REGISTERS
# ===========================================================================

- id: data-asset-register
  title: Data Asset Register
  section: registers
  path: registers/data-asset-register.md
  status: ready
  purpose: >-
    The catalogue of what data you hold, who owns it, how sensitive it is, and
    where it lives. Almost every other governance control depends on it.
  when_to_use: >-
    Start it early and keep it current. Review entries at least annually, and
    whenever a system or a data flow changes.
  how_to_use: >-
    Register your ten most important assets properly rather than every asset
    badly. A short accurate register is used; an exhaustive stale one is not.
    Set a review date on every row so staleness becomes visible.
  body: |
    ### Register fields

    | Field | Why it matters |
    |---|---|
    | Asset ID | Stable reference for linking from other registers |
    | Name & description | What it actually is, in business language |
    | Domain | Links to the owner |
    | Data Owner | Named accountable person |
    | Steward | Day-to-day contact |
    | Classification | Drives handling rules |
    | Personal data? | Triggers DPIA and lawful basis questions |
    | Special category? | Triggers additional protection |
    | System of record | Where the authoritative copy lives |
    | Source | Where it came from; licence if external |
    | Lawful basis | Required for personal data |
    | Used in AI? | Links to {{ai-system-inventory}} |
    | Quality thresholds | Links to {{data-quality-standard}} |
    | Retention | How long, and under what rule |
    | Last reviewed / next review | Makes staleness visible |

    ### The register

    | ID | Asset | Domain | Owner | Class. | Personal? | System | Used in AI | Retention | Next review |
    |---|---|---|---|---|---|---|---|---|---|
    | DA-001 | Customer master | Customer | [name] | Confidential | Yes | [CRM] | AI-003 | [7y] | [date] |
    | DA-002 | Employee records | Employee | [name] | Confidential | Yes | [HRIS] | AI-007 | [6y post-exit] | [date] |
    | DA-003 | Product telemetry | Product | [name] | Internal | No | [warehouse] | AI-001 | [2y] | [date] |
    | DA-004 | Support transcripts | Customer | [name] | Confidential | Yes | [helpdesk] | AI-002 | [3y] | [date] |

    ### Practical guidance

    **Start where the risk is.** Personal data, regulated data, and anything
    feeding an AI system first. Marketing collateral can wait.

    **One row per asset, not per table.** "Customer master" is an asset;
    forty database tables that compose it are not forty assets.

    **The "used in AI" column earns its keep.** When a model misbehaves, this is
    how you find what fed it. When a data subject exercises their rights, it is
    how you find where they appear.

    !!! tip "The staleness test"
        A register nobody has updated in six months is a liability, not a
        control — it gives false assurance. Better to register fewer assets and
        keep them true.

    ### Maintenance

    | Trigger | Action |
    |---|---|
    | New system or data flow | Register before production use |
    | Classification change | Update; review downstream handling |
    | New AI use of the asset | Update the AI column; check lawful basis covers it |
    | Annual review | Owner confirms accuracy or corrects |
  adaptation:
    - context: Small organisations
      note: >-
        A spreadsheet with the first eight columns is genuinely enough. Do not
        buy a catalogue tool before you have proven you will maintain a list.
    - context: Existing catalogue tooling
      note: >-
        Do not duplicate. Add the governance-specific fields — owner,
        classification, lawful basis, AI usage — to what you already have.
    - context: Regulated sectors
      note: >-
        Add lineage and critical-data-element flags, and link to your regulatory
        reporting inventory.
  related: [data-governance-framework, data-classification-policy, ai-system-inventory, processing-dpia-log]

- id: ai-system-inventory
  title: AI System Inventory
  section: registers
  path: registers/ai-system-inventory.md
  status: ready
  purpose: >-
    The single list of every AI system you build, buy, or have embedded in
    something you already licence. It is the foundation of AI Act compliance:
    every other obligation applies per system, so a system you have not listed is
    one you cannot govern.
  when_to_use: >-
    Create it now, before anything else. Add systems at ideation, not at launch.
    Review the whole inventory quarterly.
  how_to_use: >-
    Run a discovery sweep first — ask each team what AI they use, then check your
    SaaS contracts for AI features you did not know were switched on. Expect the
    real number to be two to three times what people initially report.
  body: |
    ### Inventory fields

    | Field | Notes |
    |---|---|
    | System ID | Stable reference |
    | Name & purpose | What it does, in business language |
    | Business owner | The **named** AI Accountable Owner |
    | Technical owner | Who operates it |
    | Build / buy / embedded | Determines which policy applies |
    | Vendor & product | For bought or embedded |
    | **Our role** | Provider / deployer / importer / distributor |
    | **Risk tier** | Prohibited / high-risk / limited / minimal |
    | Tier rationale | Why — the decision, not just the label |
    | Annex reference | If high-risk, which Annex III point |
    | Model / technique | E.g. GPT-class LLM, gradient boosting |
    | Data sources | Links to {{data-asset-register}} |
    | Personal data? | Triggers DPIA |
    | Affects individuals? | Triggers oversight and transparency duties |
    | Lifecycle stage | Ideation / dev / live / retired |
    | Human oversight | How, and by whom |
    | Documentation | Link to {{model-card}} |
    | Risk assessment | Link to {{ai-risk-assessment}} |
    | Last / next review | |

    ### The inventory

    | ID | System | Owner | Source | Role | Tier | Personal data | Stage | Next review |
    |---|---|---|---|---|---|---|---|---|
    | AI-001 | Demand forecasting | [name] | Build | Provider | Minimal | No | Live | [date] |
    | AI-002 | Support summarisation | [name] | Buy (SaaS) | Deployer | Limited | Yes | Live | [date] |
    | AI-003 | Credit decision support | [name] | Build | Provider | **High** | Yes | Live | [date] |
    | AI-004 | CV screening | [name] | Buy | Deployer | **High** | Yes | Live | [date] |
    | AI-005 | Marketing copy assistant | [name] | Embedded | Deployer | Limited | No | Live | [date] |

    ### Finding what you already have

    Most organisations under-count on the first pass. Look in all of these:

    | Where to look | What you tend to find |
    |---|---|
    | Ask each team directly | Tools bought on expenses or team cards |
    | SaaS contracts and release notes | AI features switched on by the vendor |
    | Expense claims | Individual AI subscriptions |
    | Network / SSO logs | Tools nobody declared |
    | Code repositories | Model APIs called directly |
    | Data warehouse jobs | Scoring pipelines nobody calls "AI" |

    !!! warning "Embedded AI is the blind spot"
        Your HR system, CRM, and helpdesk have almost certainly shipped AI
        features in the last two years. Some are high-risk uses under Annex III —
        CV screening especially. Nobody procured them as AI, so nobody assessed
        them.

    ### Classification decision record

    For each system, record the classification decision itself:

    | System | Tier | Rationale | Decided by | Date | Challenged? |
    |---|---|---|---|---|---|
    | AI-004 | High | Annex III(4) — employment; screens candidates | [committee] | [date] | No |

    A classification without a rationale cannot be defended later, and cannot be
    reviewed sensibly when the system changes.

    ### Maintenance

    | Trigger | Action |
    |---|---|
    | New system proposed | Register at ideation, before build |
    | Purpose changes materially | Re-classify; re-assess |
    | Vendor changes the model | Review; re-assess if behaviour changed |
    | {{default:inventory-review-cycle}} | Full review; confirm owners still in post |
    | Retirement | Mark retired; retain records per schedule |
  adaptation:
    - context: Small organisations
      note: >-
        A spreadsheet is fine. The fields that must not be dropped are owner,
        role, tier, and rationale — everything else can be added later.
    - context: Large / federated organisations
      note: >-
        Federate collection to business units with a group-level standard for
        tiering, or you will get four incompatible interpretations of high-risk.
    - context: Heavy vendor use
      note: >-
        Add contract reference and renewal date, and link to your vendor
        assessment under {{third-party-ai-risk-policy}}.
  related: [ai-governance-framework, ai-risk-assessment, model-card, third-party-ai-risk-policy]

- id: risk-register
  title: Risk Register
  section: registers
  path: registers/risk-register.md
  status: ready
  purpose: >-
    The live record of data and AI risks: what could go wrong, how likely and how
    bad, what you are doing about it, and who owns it.
  when_to_use: >-
    Continuously. Review at every committee meeting; refresh scoring at least
    quarterly.
  how_to_use: >-
    Write risks as cause, event, and consequence — "because X, Y may happen,
    leading to Z". A register full of one-word risks like "data quality" cannot
    be managed, because nobody can tell what treating it would involve.
  body: |
    ### Scoring

    **Likelihood**

    | Score | Level | Guide |
    |---|---|---|
    | 1 | Rare | Not expected in 5 years |
    | 2 | Unlikely | Possible in 3–5 years |
    | 3 | Possible | Likely within 2 years |
    | 4 | Likely | Expected this year |
    | 5 | Almost certain | Expected within months |

    **Impact**

    | Score | Level | Guide |
    |---|---|---|
    | 1 | Negligible | Absorbed in normal operation |
    | 2 | Minor | Limited, contained |
    | 3 | Moderate | Material; management attention |
    | 4 | Major | Regulatory interest; significant harm |
    | 5 | Severe | Enforcement, serious harm, or existential |

    **Rating** = likelihood × impact. 1–4 Low · 5–9 Medium · 10–14 High ·
    15–25 Critical.

    ### The register

    | ID | Risk (cause → event → consequence) | Category | L | I | Rating | Owner | Treatment | Target | Residual | Review |
    |---|---|---|---|---|---|---|---|---|---|---|
    | R-001 | Because AI systems are procured without governance review, unassessed high-risk systems may go live, leading to regulatory breach and enforcement | Compliance | 4 | 4 | **16** | [name] | Mandatory intake gate; quarterly SaaS sweep | 8 | | [date] |
    | R-002 | Because training data under-represents some groups, the model may produce discriminatory outcomes, leading to harm and legal claims | Fairness | 3 | 5 | **15** | [name] | Representativeness testing at G4; subgroup metrics | 6 | | [date] |
    | R-003 | Because staff use unapproved AI tools, confidential data may be disclosed to third parties, leading to breach notification | Security | 4 | 4 | **16** | [name] | Approved tool list; DLP; training | 8 | | [date] |
    | R-004 | Because vendors change models without notice, system behaviour may change silently, leading to undetected performance degradation | Operational | 3 | 3 | **9** | [name] | Contractual notification; output monitoring | 4 | | [date] |

    ### Treatment options

    | Option | When appropriate | Record |
    |---|---|---|
    | **Treat** | Reduce likelihood or impact | The controls and their owner |
    | **Tolerate** | Within appetite | **Who accepted it, and when** |
    | **Transfer** | Insurance or contract | Note that accountability rarely transfers |
    | **Terminate** | Risk exceeds value | The decision and rationale |

    !!! note "Tolerating is a decision with a name on it"
        Accepted risk must record who accepted it and at what level of authority
        — see {{decision-rights}}. Risk that is tolerated by nobody in particular
        is risk that has simply been ignored.

    ### Common AI risks to consider

    Use as a prompt, not a checklist to copy:

    - Unassessed or unknown systems in production
    - Discriminatory outcomes for protected groups
    - Model drift degrading performance unnoticed
    - Over-reliance: humans rubber-stamping AI output
    - Confidential data leaked into external tools
    - Prompt injection or training-data poisoning
    - Vendor model change altering behaviour
    - Inability to explain a decision when challenged
    - Missing logs when evidence is needed
    - Key-person dependency on one ML engineer

    ### Review

    | Level | Cadence |
    |---|---|
    | Critical | Monthly, at committee |
    | High | Quarterly |
    | Medium | Half-yearly |
    | Low | Annually |
  adaptation:
    - context: Small organisations
      note: >-
        A 3×3 matrix and a single register covering all risk types is easier to
        sustain than a separate AI register nobody looks at.
    - context: Existing enterprise risk management
      note: >-
        Do not create a parallel register. Add AI risks to the enterprise one
        with an AI tag, so they reach the board through the route that already
        works.
    - context: Regulated sectors
      note: >-
        Align scales with your enterprise risk framework, and map risks to the
        regulatory obligations they threaten.
  related: [ai-risk-assessment, control-library, incident-log, decision-rights]

- id: incident-log
  title: Issue & Incident Log
  section: registers
  path: registers/incident-log.md
  status: ready
  purpose: >-
    The record of what went wrong, what you did, and what changed as a result.
    It is both a management tool and the evidence base for serious-incident
    reporting duties.
  when_to_use: >-
    From day one. You need the route defined before the first incident, not
    during it.
  how_to_use: >-
    Define severity and the reporting clock in advance, and make reporting easy
    and blameless. The failure mode is not a bad log — it is people not reporting
    at all because they fear the consequences.
  body: |
    ### Severity

    | Severity | Definition | Response | Notify |
    |---|---|---|---|
    | **S1 Critical** | Harm to people, regulatory breach, or major data loss | Immediate; incident lead appointed | Committee **immediately**; Board; regulator assessment within {{default:serious-incident-assessment}} |
    | **S2 Major** | Material impact; significant risk | Within 4 hours | Committee within 24 hours |
    | **S3 Moderate** | Contained impact | Within [1 working day] | Governance Lead |
    | **S4 Minor** | Negligible | Next cycle | Logged only |

    !!! danger "The serious-incident clock"
        Under Art. 73 the reporting window for serious incidents is short and
        starts when you establish the link between the system and the incident —
        not when you finish investigating. Assess reportability **early and in
        parallel** with fixing it.

    ### The log

    | ID | Date | Title | System | Severity | Type | Reported by | Owner | Personal data? | Reportable? | Status | Closed |
    |---|---|---|---|---|---|---|---|---|---|---|---|
    | INC-001 | [date] | Model returned biased ranking | AI-004 | S2 | Fairness | [name] | [name] | Yes | Under assessment | Open | |
    | INC-002 | [date] | Confidential doc pasted into public LLM | — | S2 | Data leak | [name] | [name] | Yes | Yes — DPA | Closed | [date] |

    ### Incident types

    Fairness / bias · Accuracy or drift · Data leak · Unauthorised use ·
    Security (injection, poisoning, extraction) · Availability · Transparency
    failure · Oversight failure · Third-party / vendor · Regulatory

    ### Record for each incident

    1. **What happened** — factual, no blame.
    2. **When** — occurred, detected, reported. The gap between occurred and
       detected is itself a finding.
    3. **Impact** — who and what was affected, how many people.
    4. **Immediate action** — including whether the system was suspended.
    5. **Root cause** — the real one, not the proximate one.
    6. **Reportability assessment** — with the reasoning and the date decided.
    7. **Remediation** — actions, owners, dates.
    8. **Lessons** — what changed so it does not recur.

    ### Post-incident review

    For S1 and S2, hold a blameless review within {{default:post-incident-review-window}} Ask:

    - Could we have prevented it? Which control failed or was missing?
    - Could we have detected it sooner?
    - Did the escalation path work as written?
    - What changes in policy, control, or design follow?
    - **Does anything here change the {{risk-register}}?**

    ### Trends

    Review quarterly for pattern: repeat causes, systems appearing often, and
    detection times getting longer. Report to committee via {{kpi-dashboard}}.
  adaptation:
    - context: Small organisations
      note: >-
        Use your existing incident process and add the AI-specific fields —
        system, reportability, personal data. A separate AI process will not be
        remembered under pressure.
    - context: Regulated sectors
      note: >-
        Map severity to your existing operational incident taxonomy and
        regulatory reporting triggers, so one incident does not get two
        incompatible severities.
    - context: Consumer-facing services
      note: >-
        Add a customer communication field: what was said, by whom, and when.
        It is usually the part that gets scrutinised afterwards.
  related: [risk-register, control-library, ai-system-inventory, decision-rights]

- id: processing-dpia-log
  title: Processing & DPIA Log
  section: registers
  path: registers/processing-dpia-log.md
  status: ready
  purpose: >-
    The record of personal data processing activities and the impact assessments
    that cover them — the point where AI governance meets data protection law.
  when_to_use: >-
    Maintain continuously. Complete a DPIA before high-risk processing begins,
    not after the system is built.
  how_to_use: >-
    If you already keep an Art. 30 record of processing, extend it rather than
    starting a second list. Add the AI-specific columns and cross-reference the
    {{ai-system-inventory}} so the two can never disagree about what exists.
  body: |
    ### Processing activities

    | ID | Activity | Purpose | Lawful basis | Categories of data | Data subjects | Special category? | Recipients | Transfers | Retention | AI system | DPIA |
    |---|---|---|---|---|---|---|---|---|---|---|---|
    | P-001 | Customer support triage | Route and summarise tickets | Legitimate interests | Contact, ticket content | Customers | No | [vendor] | [country] | 3y | AI-002 | DPIA-002 |
    | P-002 | Candidate screening | Shortlist applicants | Legitimate interests | CV, application | Candidates | Possible | [vendor] | EU | 12m | AI-004 | DPIA-001 |

    ### When a DPIA is required

    A DPIA is required where processing is likely to result in high risk — and
    for AI, that is common. Triggers include:

    - [ ] Systematic and extensive **automated evaluation** of people, including
          profiling, with legal or similarly significant effects
    - [ ] Large-scale processing of **special category** data
    - [ ] Systematic **monitoring** of a publicly accessible area
    - [ ] **Innovative technology** applied to personal data — most novel AI
          qualifies
    - [ ] Processing that **prevents access** to a service or contract
    - [ ] Data concerning **vulnerable people**, including employees and children

    !!! tip "AI Act and GDPR assessments overlap — link them"
        A high-risk AI system will usually need both a DPIA and an AI risk
        assessment, and certain deployers additionally owe a fundamental rights
        impact assessment. Run them together and cross-reference; duplicating the
        analysis in two documents guarantees they will diverge.

    ### DPIA log

    | ID | System | Processing | Started | Completed | Outcome | Residual risk | DPO opinion | Consulted authority? | Review |
    |---|---|---|---|---|---|---|---|---|---|
    | DPIA-001 | AI-004 | Candidate screening | [date] | [date] | Proceed with controls | Medium | Given [date] | No | [date] |

    ### DPIA contents

    1. **Description** — nature, scope, context, purpose; how the AI works in
       terms a non-specialist can follow.
    2. **Necessity and proportionality** — lawful basis, and why a less intrusive
       option would not achieve the purpose.
    3. **Risks to individuals** — discrimination, loss of autonomy, inaccuracy,
       exclusion, distress, not merely security risk.
    4. **Measures** — controls, human oversight, transparency, and the routes for
       people to contest a decision.
    5. **Residual risk** and sign-off. If risk stays high after mitigation, prior
       consultation with the supervisory authority may be required.

    ### Individual rights with AI

    Confirm you can actually deliver these before the system goes live:

    | Right | The AI-specific question |
    |---|---|
    | Access | Can you show what data about them the system used? |
    | Rectification | Can a correction propagate to model behaviour? |
    | Erasure | Can you remove them from training data or retrain? |
    | Object | Can you exclude them from processing? |
    | Automated decisions | Can you offer human review, explanation, and challenge? |

    !!! warning "Erasure is the hard one"
        "The data is in the model weights" is not an answer a regulator accepts.
        Decide your approach — retraining cadence, exclusion lists, or not
        training on personal data at all — **before** you build.
  adaptation:
    - context: Small organisations
      note: >-
        One spreadsheet covering both processing and DPIAs is fine. The lawful
        basis and retention columns are the ones auditors ask for first.
    - context: Where a statutory DPO exists
      note: >-
        The DPO's opinion must be recorded, and where you proceed against it,
        the reasons must be documented.
    - context: Non-EU / other regimes
      note: >-
        Replace DPIA with your local equivalent (e.g. a privacy impact
        assessment). The triggers and structure translate with little change.
  related: [data-classification-policy, ai-risk-assessment, ai-system-inventory, data-asset-register]

