# POLICIES & STANDARDS
# ===========================================================================

- id: data-governance-policy
  title: Data Governance Policy
  section: policies
  path: policies/data-governance-policy.md
  status: ready
  purpose: >-
    The mandatory rules for handling data. Where the framework explains how
    governance works, this policy states what people must and must not do, in
    language you can hold someone to.
  when_to_use: >-
    Adopt alongside the data governance framework. Review annually, and reissue
    with attestation whenever the obligations change materially.
  how_to_use: >-
    Write every statement so a breach is observable — "must be registered before
    first use" can be checked, "should be managed appropriately" cannot. Number
    the statements so audit findings and exceptions can cite them precisely.
  body: |
    ### 1. Purpose

    This policy sets the mandatory requirements for the management of data at
    **[Organisation]**. It gives effect to {{data-governance-framework}}.

    ### 2. Scope

    Applies to all staff, contractors, and third parties processing data on
    behalf of the organisation, in all systems and locations.

    ### 3. Policy statements

    **Ownership**

    1. Every data domain **must** have a named Data Owner recorded in the
       {{data-asset-register}}.
    2. Data assets of material significance **must** be registered before first
       production use.

    **Classification & handling**

    3. All data **must** be classified per {{data-classification-policy}}.
    4. Data **must** be handled in line with the controls for its classification,
       including when used as input to any AI tool.
    5. Restricted or Confidential data **must not** be entered into any AI
       service that has not been approved for that classification.

    **Lawfulness**

    6. A lawful basis **must** be identified and recorded before personal data is
       processed, and recorded in the {{processing-dpia-log}}.
    7. Secondary use of personal data **must** be assessed for compatibility
       before it proceeds.

    **Quality**

    8. Data Owners **must** define quality thresholds for their domain per
       {{data-quality-standard}}.
    9. Quality breaches **must** be logged and remediated within the agreed
       timeframe.

    **Access**

    10. Access **must** be granted on least privilege and reviewed at least
        {{default:access-review-cycle}}.
    11. Access to Restricted data **must** be approved by the Data Owner.

    **Retention & disposal**

    12. Data **must not** be retained beyond the period in the retention
        schedule.
    13. Disposal **must** be verifiable and recorded.

    ### 4. Roles & responsibilities

    See {{roles-responsibilities}}. In summary: Owners are accountable, Stewards
    operate, Custodians enforce technically, and every user complies.

    ### 5. Exceptions

    Requested from the Data Owner, approved by **[the committee]**, recorded with
    a **mandatory expiry date**, and reported at each committee meeting. An
    exception without an expiry is a silent policy change.

    ### 6. Compliance

    Breaches are handled under **[the disciplinary / supplier management
    process]**. Material breaches are reported to **[the committee]** and logged
    in the {{incident-log}}.

    ### 7. Review

    | Version | Date | Owner | Approved by | Next review |
    |---|---|---|---|---|
    | 0.1 | [date] | [role] | [committee] | [date] |
  adaptation:
    - context: Small organisations
      note: >-
        Statements 1–7 and 12 are the irreducible core. Add the rest as you grow
        rather than publishing rules you cannot enforce.
    - context: Regulated sectors
      note: >-
        Cross-reference each statement to the supervisory requirement it
        satisfies, so audit can trace obligation to control in one hop.
    - context: Heavy SaaS estates
      note: >-
        Statement 5 is the one that gets breached most. Pair it with an approved
        tool list people can actually find, or it becomes shelf-ware.
  related: [data-governance-framework, data-classification-policy, data-quality-standard, processing-dpia-log]

- id: data-quality-standard
  title: Data Quality Standard
  section: policies
  path: policies/data-quality-standard.md
  status: ready
  purpose: >-
    Defines what "good enough" data means in measurable terms — the dimensions,
    how they are measured, the thresholds that apply, and who acts when a
    threshold is breached.
  when_to_use: >-
    Alongside the data governance policy, and specifically before any dataset is
    used to train or evaluate a model. Review thresholds annually.
  how_to_use: >-
    Do not attempt all six dimensions across the whole estate at once. Pick your
    two or three highest-value domains, set thresholds, and measure those until
    the process is real — then extend. A standard measured nowhere is worse than
    no standard, because it implies assurance you do not have.
  body: |
    ### 1. Quality dimensions

    | Dimension | Question it answers | Example measure |
    |---|---|---|
    | **Completeness** | Is the expected data present? | % of mandatory fields populated |
    | **Accuracy** | Does it reflect the real world? | % matching a verified source |
    | **Timeliness** | Is it current enough to use? | Age at point of use vs. requirement |
    | **Consistency** | Does it agree across systems? | % of records matching across systems |
    | **Validity** | Does it conform to its rules? | % passing format / range rules |
    | **Uniqueness** | Are there duplicates? | % duplicate records |

    ### 2. Thresholds

    Thresholds are set per domain by the Data Owner, based on use. Data feeding
    a regulatory return or a high-risk AI system needs tighter thresholds than
    data feeding an internal dashboard.

    | Domain | Dimension | Threshold | Measure | Frequency | Owner |
    |---|---|---|---|---|---|
    | Customer | Completeness | ≥ 98% | [rule] | Daily | [role] |
    | Customer | Uniqueness | ≥ 99% | [rule] | Weekly | [role] |
    | [domain] | [dimension] | | | | |

    ### 3. Quality for AI training data

    Additional requirements where data trains, validates, or tests a model — this
    is the Art. 10 obligation in practice:

    | Requirement | What it means | Evidence |
    |---|---|---|
    | **Relevance** | The data suits the stated purpose. | Documented rationale in the {{model-card}} |
    | **Representativeness** | It reflects the population the system will act on. | Distribution analysis vs. target population |
    | **Bias examination** | Known skews are identified and addressed. | Bias assessment; mitigation record |
    | **Provenance** | Source and licence are known and lawful. | Entry in {{data-asset-register}} |
    | **Split integrity** | Train/validation/test do not leak into each other. | Split methodology documented |

    !!! warning "Representativeness is not a percentage"
        A dataset can be 99% complete and still unrepresentative of the people
        the system will affect. Completeness measures the data you collected;
        representativeness asks who is missing from it entirely.

    ### 4. Measurement & reporting

    Scores are produced **monthly** (weekly for data feeding a high-risk system), published to **[location]**, and
    summarised in {{kpi-dashboard}}. Trend matters more than absolute level.

    ### 5. Breach handling

    | Severity | Definition | Response | Timeframe |
    |---|---|---|---|
    | Critical | Regulatory or high-risk AI impact | Escalate to committee; consider suspending use | 24 hours |
    | Major | Material business impact | Owner-led remediation plan | 5 working days |
    | Minor | Limited impact | Backlog for next cycle | 30 days |

    Breaches are recorded in the {{incident-log}}.

    ### 6. Review

    | Version | Date | Owner | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [role] | [committee] |
  adaptation:
    - context: Small organisations
      note: >-
        Measure completeness and validity only, on your two most important
        domains. That covers most real-world failures at a fraction of the cost.
    - context: Regulated financial services
      note: >-
        Align with BCBS 239 and make lineage evidence explicit — supervisors ask
        to trace a reported figure back to source.
    - context: ML-heavy organisations
      note: >-
        Section 3 is the section that matters. Automate representativeness and
        drift checks into the training pipeline so the evidence is a by-product
        rather than a project.
  related: [data-governance-policy, data-asset-register, model-card, kpi-dashboard]

- id: data-classification-policy
  title: Data Classification & Handling Policy
  nav: Data Classification & Handling
  section: policies
  path: policies/data-classification-policy.md
  status: ready
  purpose: >-
    Defines the sensitivity tiers your data falls into and the handling rules for
    each — including the rules that decide what may be pasted into an AI tool.
  when_to_use: >-
    Early. Classification underpins access control, AI input rules, and most
    security decisions. Review annually.
  how_to_use: >-
    Use four tiers at most; every tier beyond that is one people will not
    remember. The AI handling row in section 2 is the part staff will actually
    look up — make sure it names specific approved tools, not a category.
  body: |
    ### 1. Classification tiers

    | Tier | Definition | Examples | Impact if disclosed |
    |---|---|---|---|
    | **Public** | Approved for public release. | Published marketing, annual report | None |
    | **Internal** | Routine business data. | Internal comms, non-sensitive analytics | Minor |
    | **Confidential** | Sensitive business or personal data. | Customer records, employee data, contracts | Significant |
    | **Restricted** | Most sensitive; severe impact. | Special category data, credentials, M&A, security detail | Severe |

    ### 2. Handling rules

    | Control | Public | Internal | Confidential | Restricted |
    |---|---|---|---|---|
    | Storage | Any approved | Approved systems | Approved + access control | Approved + encryption + logging |
    | Access | Open | All staff | Role-based, owner-approved | Named individuals, owner-approved |
    | Sharing externally | Free | NDA | Contract + DPA | Owner + Legal approval |
    | Email | Permitted | Permitted | Encrypted | Not permitted — secure transfer only |
    | **AI tool input** | **Permitted** | **Approved tools only** | **Approved enterprise tools with no-training guarantee** | **Prohibited unless explicitly approved for that system** |
    | Retention | Per schedule | Per schedule | Per schedule + review | Per schedule + documented review |
    | Disposal | Standard | Standard | Verified | Verified + certificate |

    !!! danger "The AI row is the one that gets breached"
        Staff paste customer data into public chatbots because it is convenient
        and the rule was not to hand. Publish this row separately, name the
        approved tools, and put it where people work.

    ### 3. Applying a classification

    1. The Data Owner assigns the classification at creation or acquisition.
    2. Where a dataset holds mixed tiers, **the highest tier applies to the whole
       set** unless it is separated.
    3. Classification is recorded in the {{data-asset-register}}.
    4. Derived data — including model outputs and embeddings — inherits the
       classification of its most sensitive input unless a documented assessment
       lowers it.

    !!! note "Derived data inherits"
        Embeddings and model outputs derived from Confidential data are
        Confidential. This is routinely missed, and it is how sensitive data ends
        up in an unprotected vector store.

    ### 4. Special category & regulated data

    Special category personal data, criminal offence data, children's data, and
    payment card data carry additional requirements — see
    {{processing-dpia-log}}. Default these to **Restricted** unless assessed
    otherwise.

    ### 5. Labelling

    Where the platform supports it, apply the label in the tool. Where it does
    not, record classification in the register. **[Specify your labelling
    mechanism.]**

    ### 6. Review

    | Version | Date | Owner | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [role] | [committee] |
  adaptation:
    - context: Small organisations
      note: >-
        Three tiers — Public, Internal, Confidential — is usually enough. Keep
        the AI input row regardless; it is the highest-value line in the policy.
    - context: Existing security classification
      note: >-
        Do not create a competing scheme. Map onto what security already uses and
        add only the AI handling row.
    - context: Public sector
      note: >-
        Align to your national scheme (e.g. OFFICIAL / SECRET) rather than these
        labels, and add the FOI disclosure consideration to each tier.
  related: [data-governance-policy, acceptable-ai-use-policy, data-asset-register, processing-dpia-log]

- id: acceptable-ai-use-policy
  title: Acceptable AI Use Policy
  section: policies
  path: policies/acceptable-ai-use-policy.md
  status: ready
  purpose: >-
    The staff-facing rules for using AI at work: what is encouraged, what needs
    approval, and what is never allowed. This is the most-read document in the
    kit, and usually the one that prevents the most damage.
  when_to_use: >-
    As early as possible — staff are already using AI tools whether or not you
    have a policy. Review at least twice a year while the tool landscape moves.
  how_to_use: >-
    Write it for the whole workforce, not for specialists: one page, plain
    language, specific tool names. Pair it with a genuinely usable approved-tool
    list. A policy that only says "seek approval" without saying from whom, and
    how long it takes, produces shadow AI rather than compliance.
  body: |
    ### 1. Purpose

    This policy sets out how people at **[Organisation]** may and may not use AI
    tools. It applies to everyone — employees, contractors, and anyone acting on
    our behalf — and to all AI tools, whether we provide them or not.

    ### 2. The short version

    !!! tip "If you read nothing else"
        **You are accountable for anything you produce with AI, exactly as if you
        had written it yourself.** Check it before it goes out. Never put
        Confidential or Restricted information into a tool that has not been
        approved for it. Tell people when they are dealing with AI output that
        affects them.

    ### 3. Approved tools

    | Tool | Approved for | Maximum data classification | Owner |
    |---|---|---|---|
    | [Tool A] | [General drafting, summarising] | Internal | [role] |
    | [Tool B] | [Coding assistance] | Confidential | [role] |
    | [Tool C] | [Customer-facing] | [Restricted — with controls] | [role] |

    Tools not on this list are **not approved**. To request one, contact
    **[route]** — expected turnaround {{default:tool-approval-turnaround}}.

    ### 4. Always prohibited

    You **must not** use AI to:

    1. Perform any practice prohibited by the EU AI Act — social scoring,
       manipulative techniques, untargeted scraping of facial images, emotion
       inference in the workplace, or unlawful biometric categorisation.
    2. Make a final decision that materially affects a person — hiring, firing,
       promotion, credit, pricing, or access to a service — **without meaningful
       human review**.
    3. Enter Restricted data into any tool not explicitly approved for it.
    4. Generate content that impersonates a real person or organisation.
    5. Circumvent a control, or produce material you know to be misleading.

    ### 5. Requires approval before you proceed

    | Situation | Approve with |
    |---|---|
    | New AI tool, or new use of an existing one | [Governance / IT] |
    | AI affecting customers or the public | [Committee] |
    | AI in HR, recruitment, or performance decisions | [HR + Legal] — Annex III high-risk |
    | AI processing special category personal data | [DPO] |
    | Building or fine-tuning a model | [Governance] — see {{ai-development-standard}} |

    ### 6. Your responsibilities when using AI

    - **Verify output.** AI is confidently wrong. You own what you send.
    - **Protect data.** Check the classification before you paste — see
      {{data-classification-policy}}.
    - **Be transparent.** Tell people when they are interacting with AI, and
      disclose AI-generated content where it could mislead.
    - **Watch for bias.** If output looks skewed against a group, stop and report
      it.
    - **Report problems** to **[route]** — they go in the {{incident-log}}.

    ### 7. What we encourage

    This policy exists to make safe AI use easy, not to discourage it. Drafting,
    summarising, research, code assistance, and analysis on Internal data using
    approved tools need no special permission. **If in doubt, ask — asking is
    never the wrong answer.**

    ### 8. Breaches

    Handled under **[the disciplinary process]**. Self-reported mistakes are
    treated far more leniently than concealed ones — we would rather know.

    ### 9. Review

    | Version | Date | Owner | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [role] | [committee] |
  adaptation:
    - context: Small organisations
      note: >-
        Sections 2, 3, and 4 alone make a usable one-page policy. Publish that
        this week rather than a complete one next quarter.
    - context: Regulated sectors
      note: >-
        Add record-keeping obligations for AI-assisted advice or communications,
        and align section 4 with your existing conduct rules.
    - context: Engineering-heavy organisations
      note: >-
        Add explicit rules for code assistants: licence contamination from
        suggested code, secrets in prompts, and review requirements for
        AI-generated code paths.
    - context: Unions / works councils
      note: >-
        Where AI touches workforce monitoring or employment decisions,
        consultation may be required before you publish. Involve them early
        rather than presenting a finished policy.
  related: [ai-governance-framework, data-classification-policy, ai-development-standard, incident-log]

- id: ai-development-standard
  title: AI Development & Deployment Standard
  section: policies
  path: policies/ai-development-standard.md
  status: ready
  purpose: >-
    The engineering-facing requirements for building, testing, deploying, and
    operating AI systems — the technical controls that make the framework's
    principles real inside a delivery pipeline.
  when_to_use: >-
    Applies to every system you build or materially fine-tune. Apply the gates
    proportionately: full rigour for high-risk, light touch for minimal.
  how_to_use: >-
    Implement the gates as pipeline checks rather than documents wherever you
    can. A requirement that a human must remember to check will be skipped under
    deadline pressure; one that fails a build will not.
  body: |
    ### 1. Scope

    Applies to AI systems built, fine-tuned, or materially configured by
    **[Organisation]**. Third-party systems used as-is fall under
    {{third-party-ai-risk-policy}}.

    ### 2. Lifecycle gates

    | Gate | Requirement | Evidence | Blocking? |
    |---|---|---|---|
    | **G1 Intake** | Prohibited-practice screen; risk tier assigned; registered. | {{ai-system-inventory}} entry | Yes — all tiers |
    | **G2 Data** | Sources registered, lawful, classified; quality assessed. | {{data-asset-register}}; quality report | Yes — all tiers |
    | **G3 Design** | Risk assessment started; oversight approach defined. | {{ai-risk-assessment}} | High-risk |
    | **G4 Build** | Evaluation plan; bias testing; version control of data and model. | Test results | High-risk |
    | **G5 Pre-deploy** | Documentation complete; oversight operable; owner sign-off. | {{model-card}}; sign-off | Yes — all tiers |
    | **G6 Operate** | Monitoring live; logging retained; incident route defined. | Monitoring config | High-risk |
    | **G7 Change** | Material change re-triggers G3–G5. | Change record | High-risk |
    | **G8 Retire** | Decommissioned; records retained; inventory updated. | Retirement record | Yes — all tiers |

    ### 3. Data requirements

    - Training, validation, and test data **must** be documented as to source,
      licence, and lawful basis.
    - Splits **must** be documented and leakage-checked.
    - Representativeness **must** be assessed against the affected population.
    - Data versions **must** be recorded so results can be reproduced.

    ### 4. Evaluation

    | Requirement | Minimal | High-risk |
    |---|---|---|
    | Accuracy metrics declared | Recommended | **Required** |
    | Performance across subgroups | Recommended | **Required** |
    | Robustness / adversarial testing | Optional | **Required** |
    | Reproducible evaluation | Recommended | **Required** |
    | Independent review of results | Optional | **Required** |

    Declare metrics **before** running the evaluation. Choosing the metric after
    seeing the results is how systems get approved on the one number that
    happened to look acceptable.

    ### 5. Logging

    High-risk systems **must** automatically log, at minimum: timestamp, system
    and model version, input reference, output, confidence where available, and
    any human override. Retain per {{default:log-retention}} — long enough to
    reconstruct a decision if it is challenged.

    !!! note "Application logs are usually not enough"
        Standard telemetry records that a request happened. Art. 12 traceability
        needs what the model was asked and what it answered. These are rarely the
        same log.

    ### 6. Human oversight implementation

    - The interface **must** show the reviewer what they need in order to judge
      the output, including uncertainty.
    - Override **must** be possible without engineering involvement.
    - Overrides **must** be logged and reviewed for pattern — a system that is
      overridden constantly is not working.
    - Reviewer workload **must** allow genuine consideration. Record the assumed
      review time per decision.

    ### 7. Security

    Address AI-specific threats alongside conventional application security:
    prompt injection, training-data poisoning, model extraction, membership
    inference, and unintended disclosure through outputs. See
    {{control-library}}.

    ### 8. Deployment & rollback

    Staged rollout for high-risk systems, with a **tested** rollback path and a
    defined kill switch. Record who can invoke it — see {{decision-rights}}.

    ### 9. Review

    | Version | Date | Owner | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [role] | [committee] |
  adaptation:
    - context: Small teams
      note: >-
        Gates G1, G2, G5, and G8 are the minimum viable set: know what you have,
        know your data is lawful, check before launch, clean up after.
    - context: MLOps-mature organisations
      note: >-
        Map each gate to an existing pipeline stage and enforce it in CI. The
        goal is that evidence is produced as a by-product rather than assembled
        before an audit.
    - context: Regulated financial services
      note: >-
        Add independent model validation before G5 and align documentation with
        your model risk management standard.
    - context: Mostly buying, not building
      note: >-
        This standard will be largely out of scope. Invest instead in
        {{third-party-ai-risk-policy}} and contractual evidence rights.
  related: [ai-governance-framework, model-card, ai-risk-assessment, control-library]

- id: third-party-ai-risk-policy
  title: Third-Party AI Risk Policy
  section: policies
  path: policies/third-party-ai-risk-policy.md
  status: ready
  purpose: >-
    How you assess, contract for, and monitor AI you did not build — including AI
    features that appear inside software you already licence. For most
    organisations this is the majority of their AI exposure.
  when_to_use: >-
    At procurement, at renewal, and whenever a vendor announces new AI
    functionality in an existing product.
  how_to_use: >-
    The hard part is not the assessment; it is finding out that a vendor switched
    AI on. Build the trigger into contract renewal and vendor release-note
    reviews, and accept that you will discover some AI features after the fact.
  body: |
    ### 1. Scope

    Applies to any AI capability we consume rather than build: standalone AI
    products, AI features inside existing SaaS, APIs and foundation models, and
    outsourced services using AI on our behalf.

    !!! warning "The invisible majority"
        Most organisations' largest AI exposure is AI switched on inside software
        they already bought. Your CRM, HR system, and support desk have all
        shipped AI features. Assume you have more than you know.

    ### 2. Vendor risk tiering

    | Tier | Criteria | Assessment depth |
    |---|---|---|
    | **Critical** | High-risk use case, or personal / Restricted data, or customer-facing decisions | Full assessment + contractual controls + annual review |
    | **Significant** | Confidential data, or a material business process | Standard assessment + contract terms |
    | **Limited** | Internal data, non-critical | Lightweight screen |

    ### 3. Assessment questions

    Ask before purchase, and record the answers.

    **The system**

    1. What does it do, and what decisions does it inform or make?
    2. Are we the provider or the deployer under the AI Act? (Rebranding or
       fine-tuning can make you the provider.)
    3. What is its risk classification?

    **Data**

    4. What data do we send, and at what classification?
    5. **Is our data used to train their models?** Can that be disabled
       contractually, not merely by a setting?
    6. Where is data processed and stored, and who else can access it?
    7. What is retained after termination?

    **Model & assurance**

    8. What model underlies it, and are we told when it changes?
    9. What documentation exists — model cards, evaluations, bias testing?
    10. What accuracy and robustness evidence can they provide?
    11. Do they hold relevant certifications (ISO/IEC 42001, SOC 2)?

    **Compliance**

    12. Can they evidence AI Act compliance for their role?
    13. Will they support our obligations — documentation, incident notification,
        audit?
    14. What is their incident notification commitment, and in what timeframe?

    ### 4. Contract clauses to require

    | Clause | Why |
    |---|---|
    | AI Act obligation flow-down | You remain accountable for what you deploy. |
    | No training on our data (or explicit consent) | Prevents your confidential data improving a shared model. |
    | Notification of material model change | A silent model swap can change system behaviour overnight. |
    | Documentation rights | You cannot evidence what you cannot obtain. |
    | Audit or third-party assurance rights | Trust needs verification. |
    | Incident notification within {{default:vendor-incident-notification}} | Your own reporting clock may already be running. |
    | Data location and sub-processor control | Transfer and access obligations. |
    | Exit: data return and deletion | Avoids hostage data at renewal. |

    ### 5. Ongoing monitoring

    | Activity | Frequency |
    |---|---|
    | Reassess Critical vendors | {{default:vendor-reassessment}} |
    | Review vendor release notes for new AI features | {{default:inventory-review-cycle}} |
    | Confirm certifications still current | Annually |
    | Review incidents involving the vendor | Each occurrence |

    ### 6. Recording

    Every third-party AI system is entered in the {{ai-system-inventory}}, marked
    as third-party, with vendor, tier, assessment date, and review date.

    ### 7. Review

    | Version | Date | Owner | Approved by |
    |---|---|---|---|
    | 0.1 | [date] | [role] | [committee] |
  adaptation:
    - context: Small organisations
      note: >-
        You will not renegotiate the contracts of large vendors. Focus on
        questions 4–7 (data handling), choose products with acceptable defaults,
        and document the residual risk you are accepting.
    - context: Regulated sectors
      note: >-
        Align with your existing outsourcing and operational resilience regime —
        AI vendors supporting important business services likely fall inside it
        already.
    - context: Public sector
      note: >-
        Fold these questions into your standard procurement framework so the
        assessment happens inside a process staff already follow.
  related: [ai-system-inventory, ai-governance-framework, control-library, acceptable-ai-use-policy]

